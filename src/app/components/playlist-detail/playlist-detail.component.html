<div class="max-w-5xl mx-auto animate-fade-in">

    <!-- Back Button -->
    <button (click)="onBack()"
        class="mb-6 flex items-center gap-2 text-zinc-400 hover:text-emerald-400 transition-colors group">
        <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="currentColor" viewBox="0 0 24 24">
            <path d="M21 11H6.414l5.293-5.293-1.414-1.414L2.586 12l7.707 7.707 1.414-1.414L6.414 13H21z" />
        </svg>
        <span>Volver a mis playlists</span>
    </button>

    <!-- Play All Hero Section -->
    <div class="relative overflow-hidden bg-gradient-to-br from-emerald-600 via-green-700 to-teal-800 rounded-3xl p-5 md:p-12 shadow-2xl shadow-emerald-500/40 border border-emerald-500/20 cursor-pointer hover:scale-[1.02] transition-transform"
        (click)="onPlayPlaylist()">

        <!-- Animated Background Pattern -->
        <div
            class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iMC4wNSI+PHBhdGggZD0iTTM2IDE0YzAtMi4yMSAxLjc5LTQgNC00czQgMS43OSA0IDQtMS43OSA0LTQgNC00LTEuNzktNC00em0wIDQwYzAtMi4yMSAxLjc5LTQgNC00czQgMS43OSA0IDQtMS43OSA0LTQgNC00LTEuNzktNC00ek0xNCAzNmMtMi4yMSAwLTQtMS43OS00LTRzMS43OS00IDQtNCA0IDEuNzkgNCA0LTEuNzkgNC00IDR6Ii8+PC9nPjwvZz48L3N2Zz4=')] opacity-30">
        </div>

        <!-- Glow Effects -->
        <div
            class="absolute top-0 right-0 w-64 h-64 md:w-96 md:h-96 bg-teal-500/20 rounded-full blur-3xl -mr-20 -mt-20">
        </div>
        <div
            class="absolute bottom-0 left-0 w-64 h-64 md:w-96 md:h-96 bg-emerald-500/20 rounded-full blur-3xl -ml-20 -mb-20">
        </div>

        <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-5 md:gap-6">
            <div class="flex items-center gap-4 md:gap-6 w-full md:w-auto">
                <!-- Playlist Cover -->
                <div class="relative shrink-0">
                    <div
                        class="w-14 h-14 md:w-24 md:h-24 bg-gradient-to-br from-emerald-500 to-green-600 rounded-xl md:rounded-2xl flex items-center justify-center shadow-xl border border-white/20">
                        <svg class="w-8 h-8 md:w-12 md:h-12 text-white drop-shadow-lg" fill="currentColor"
                            viewBox="0 0 24 24">
                            <path
                                d="M6 18.573c2.206 0 4-1.794 4-4V4.428L19 7.7v7.43a3.953 3.953 0 0 0-2-.557c-2.206 0-4 1.794-4 4s1.794 4 4 4 4-1.794 4-4V7a.998.998 0 0 0-.658-.939l-11-4A.999.999 0 0 0 8 3v8.13a3.953 3.953 0 0 0-2-.557c-2.206 0-4 1.794-4 4s1.794 4 4 4z" />
                        </svg>
                    </div>
                    <div
                        class="absolute -top-1 -right-1 w-5 h-5 md:w-7 md:h-7 bg-teal-400 rounded-full flex items-center justify-center text-[10px] md:text-xs font-bold text-white shadow-lg">
                        {{playlist.songs.length}}
                    </div>
                </div>

                <!-- Text Info -->
                <div class="text-white flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span
                            class="px-2 py-0.5 bg-white/20 backdrop-blur-sm text-white text-[10px] md:text-xs font-bold uppercase tracking-wider rounded-full border border-white/30">
                            Playlist
                        </span>
                    </div>
                    <h2 class="text-2xl md:text-4xl font-bold mb-1 drop-shadow-lg truncate">{{playlist.name}}</h2>
                    <p class="text-emerald-100/80 text-xs md:text-base max-w-md truncate">
                        {{playlist.description || 'Sin descripción'}}
                    </p>
                </div>
            </div>

            <!-- Play All Button -->
            <div *ngIf="playlist.songs.length > 0"
                class="group relative w-full md:w-auto px-6 py-3 md:px-10 md:py-5 bg-white hover:bg-emerald-50 text-emerald-600 font-bold rounded-xl md:rounded-2xl transition-all shadow-2xl hover:shadow-white/30 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-3">
                <div
                    class="absolute inset-0 bg-gradient-to-r from-white to-emerald-50 rounded-xl md:rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity">
                </div>
                <svg class="w-6 h-6 md:w-10 md:h-10 relative z-10 group-hover:scale-110 transition-transform"
                    fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z" />
                    <path d="m9 16 7-4-7-4z" />
                </svg>
                <div class="relative z-10 text-left">
                    <div class="text-xs md:text-sm opacity-75 font-normal leading-none mb-0.5">Reproducir</div>
                    <div class="text-base md:text-xl leading-none">Toda la Playlist</div>
                </div>
            </div>
        </div>

        <!-- Action Buttons Row -->
        <div class="relative z-10 flex flex-wrap items-center gap-3 mt-4 md:mt-6 pt-4 md:pt-6 border-t border-white/10">
            <button (click)="$event.stopPropagation(); onShare()"
                class="flex-1 md:flex-none px-4 py-2 bg-white/10 hover:bg-white/20 backdrop-blur-sm text-white text-sm font-medium rounded-lg transition-all border border-white/20 hover:border-white/30 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" />
                </svg>
                <span>Compartir</span>
            </button>

            <button (click)="$event.stopPropagation(); onDeletePlaylist()"
                class="flex-1 md:flex-none px-4 py-2 bg-red-500/20 hover:bg-red-500/30 backdrop-blur-sm text-red-100 hover:text-white text-sm font-medium rounded-lg transition-all border border-red-400/30 hover:border-red-400/50 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M5 20a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8h2V6h-4V4a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2H3v2h2zM9 4h6v2H9zM8 8h9v12H7V8z" />
                    <path d="M9 10h2v8H9zm4 0h2v8h-2z" />
                </svg>
                <span>Eliminar</span>
            </button>
        </div>
    </div>

    <!-- Playlist Songs List -->
    <div *ngIf="playlist.songs.length > 0" class="mt-8 space-y-2">
        <div *ngFor="let song of playlist.songs; let i = index" (click)="onPlaySong(song)"
            class="group flex items-center gap-3 md:gap-4 p-2 md:p-3 rounded-xl hover:bg-zinc-900/50 transition-colors border border-transparent hover:border-zinc-800 cursor-pointer"
            [class.bg-zinc-900]="currentSongId === song.id" [class.border-l-4]="currentSongId === song.id"
            [class.border-l-emerald-500]="currentSongId === song.id">

            <!-- Number/Play Icon -->
            <div class="w-6 md:w-8 flex items-center justify-center flex-shrink-0 text-zinc-500 text-sm font-bold">
                <span class="group-hover:hidden" [class.text-emerald-500]="currentSongId === song.id">{{ i + 1 }}</span>
                <button class="hidden group-hover:block text-white hover:scale-110 transition-transform">
                    <svg class="w-5 h-5 md:w-6 md:h-6" fill="currentColor" viewBox="0 0 24 24"
                        *ngIf="currentSongId !== song.id || !isPlaying">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    <svg class="w-5 h-5 md:w-6 md:h-6 text-emerald-500" fill="currentColor" viewBox="0 0 24 24"
                        *ngIf="currentSongId === song.id && isPlaying">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                    </svg>
                </button>
            </div>

            <!-- Album Art -->
            <div
                class="relative w-10 h-10 md:w-12 md:h-12 rounded-lg overflow-hidden bg-zinc-800 shadow-sm flex-shrink-0">
                <img [src]="song.img" class="w-full h-full object-cover">
            </div>

            <!-- Song Info -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                    <h4 class="text-white font-bold text-sm md:text-base truncate leading-tight mb-0.5"
                        [class.text-emerald-500]="currentSongId === song.id">{{ song.title }}</h4>
                    <!-- Offline Badge -->
                    <span *ngIf="isOffline(song.id)"
                        class="flex-shrink-0 w-4 h-4 bg-emerald-500 text-black rounded-full flex items-center justify-center"
                        title="Disponible offline">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                        </svg>
                    </span>
                </div>
                <p class="text-zinc-500 text-xs md:text-sm truncate">{{ song.artist }}</p>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-1 md:gap-2">
                <!-- 1. Normal Download Button (To device) -->
                <button (click)="onDownloadSong(song, $event)" title="Descargar archivo MP3"
                    class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center hover:bg-zinc-800 transition-colors group/dl">
                    <svg class="w-5 h-5 text-zinc-500 group-hover/dl:text-emerald-400" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </button>

                <!-- 2. Offline Download Button (To app) -->
                <button (click)="onDownloadOffline(song, $event)" title="Guardar para escuchar offline en la app"
                    class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center hover:bg-zinc-800 transition-colors group/off"
                    *ngIf="!isOffline(song.id)">
                    <svg class="w-5 h-5 text-zinc-500 group-hover/off:text-cyan-400" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10" />
                    </svg>
                </button>

                <!-- 3. Remove Button -->
                <button (click)="onRemoveSong(song.id, $event)" title="Quitar de playlist"
                    class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center hover:bg-zinc-800 transition-colors active:scale-95 group/btn">
                    <svg class="w-5 h-5 md:w-6 md:h-6 text-zinc-600 group-hover/btn:text-red-500 transition-colors"
                        fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <div *ngIf="playlist.songs.length === 0"
        class="mt-8 text-center py-16 bg-zinc-900/30 rounded-3xl border border-zinc-800 border-dashed">
        <div class="w-20 h-20 bg-zinc-800 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-zinc-600" fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M6 18.573c2.206 0 4-1.794 4-4V4.428L19 7.7v7.43a3.953 3.953 0 0 0-2-.557c-2.206 0-4 1.794-4 4s1.794 4 4 4 4-1.794 4-4V7a.998.998 0 0 0-.658-.939l-11-4A.999.999 0 0 0 8 3v8.13a3.953 3.953 0 0 0-2-.557c-2.206 0-4 1.794-4 4s1.794 4 4 4z" />
            </svg>
        </div>
        <h3 class="text-xl font-bold text-white mb-2">Tu playlist está vacía</h3>
        <p class="text-zinc-500">Agrega canciones desde el reproductor para comenzar a escuchar.</p>
    </div>
</div>
