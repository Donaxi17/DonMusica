<div
    class="min-h-screen bg-gradient-to-br from-zinc-950 via-zinc-900 to-black py-8 px-4 relative overflow-hidden flex items-center justify-center">

    <!-- Efectos de Fondo -->
    <div
        class="absolute top-0 left-0 w-64 h-64 bg-red-600/10 rounded-full blur-[80px] animate-pulse-slow pointer-events-none">
    </div>
    <div class="absolute bottom-0 right-0 w-64 h-64 bg-green-600/10 rounded-full blur-[80px] animate-pulse-slow pointer-events-none"
        style="animation-delay: 2s;"></div>

    <div class="w-full max-w-2xl relative z-10">
        <!-- Header -->
        <div class="text-center mb-8 animate-fade-in">
            <div
                class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-red-600 to-red-800 rounded-2xl mb-4 shadow-xl shadow-red-600/20">
                <app-svg-icon name="youtube" class="text-white w-10 h-10"></app-svg-icon>
            </div>
            <h1
                class="text-4xl md:text-5xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-white via-gray-200 to-gray-400">
                Convertidor MP3
            </h1>
            <p class="text-gray-400 text-lg max-w-md mx-auto">
                Descarga música en segundos de forma segura
            </p>
        </div>

        <!-- Tarjeta Principal -->
        <div class="bg-zinc-900/80 backdrop-blur-xl border border-white/10 rounded-3xl p-6 md:p-8 shadow-2xl mb-6">

            <!-- Selector de Servicio -->
            <div class="mb-8">
                <label
                    class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 block flex items-center gap-2">
                    <app-svg-icon name="star" class="w-4 h-4"></app-svg-icon> 1. Elige tu herramienta favorita
                </label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <button *ngFor="let service of SERVICES" (click)="selectService(service.id)" [ngClass]="{
                            'ring-2 ring-emerald-500 bg-emerald-600/20': selectedService === service.id,
                            'bg-black/50 hover:bg-white/5 border-white/10': selectedService !== service.id
                        }" class="border rounded-xl p-4 text-left transition-all relative overflow-hidden group">

                        <!-- Checkmark seleccionado -->
                        <div *ngIf="selectedService === service.id" class="absolute top-2 right-2 text-emerald-500">
                            <app-svg-icon name="check-circle" class="w-4 h-4"></app-svg-icon>
                        </div>

                        <div class="flex items-center gap-3 mb-2">
                            <app-svg-icon [name]="service.icon" [class]="service.color + ' w-6 h-6'"></app-svg-icon>
                            <span class="text-white font-bold">{{ service.name }}</span>
                        </div>
                        <p class="text-gray-400 text-[11px] leading-tight">{{ service.description }}</p>
                    </button>
                </div>
            </div>

            <!-- Input URL -->
            <form (submit)="$event.preventDefault(); convert()" class="mb-6">
                <label
                    class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 block flex items-center gap-2">
                    <app-svg-icon name="youtube" class="w-4 h-4"></app-svg-icon> 2. Pega el enlace del video
                </label>
                <div class="relative group">
                    <input type="text" [(ngModel)]="youtubeUrl" name="youtube_url"
                        placeholder="https://youtube.com/watch?v=..."
                        class="w-full bg-black/50 border border-white/10 rounded-2xl px-5 py-4 text-lg text-white placeholder-gray-600 focus:border-red-500/50 focus:ring-2 focus:ring-red-500/20 outline-none transition-all shadow-inner group-hover:border-white/20">

                    <button *ngIf="youtubeUrl" (click)="clearForm(); $event.preventDefault()" type="button"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white p-2 rounded-full hover:bg-white/10 transition-colors">
                        <app-svg-icon name="x" class="w-5 h-5"></app-svg-icon>
                    </button>
                </div>
            </form>

            <!-- Botón Acción -->
            <button (click)="convert()" [disabled]="!youtubeUrl"
                class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-4 rounded-2xl transition-all transform active:scale-[0.98] shadow-lg shadow-red-600/20 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden">
                <div
                    class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                </div>
                <span class="flex items-center justify-center gap-2 text-lg relative z-10">
                    <app-svg-icon name="external-link" class="w-6 h-6"></app-svg-icon>
                    Abrir y Descargar
                </span>
            </button>

            <!-- Info Box -->
            <div class="mt-6 p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-xl animate-fade-in">
                <div class="flex items-start gap-3">
                    <app-svg-icon name="check-circle"
                        class="text-emerald-400 w-5 h-5 mt-0.5 flex-shrink-0"></app-svg-icon>
                    <div class="text-sm text-emerald-100/90">
                        <p class="font-bold mb-1">¡Listo para descargar!</p>
                        <p class="text-emerald-200/70 text-xs">
                            Copiaremos el enlace automáticamente. Al abrirse la ventana, solo presiona
                            <span class="bg-black/30 px-1 py-0.5 rounded font-mono text-white">Ctrl + V</span>
                            (o Pegar) y listo.
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Trust Indicators -->
        <div class="flex justify-center gap-8 opacity-60">
            <div class="flex items-center gap-2">
                <app-svg-icon name="shield" class="w-4 h-4 text-gray-400"></app-svg-icon>
                <span class="text-xs text-gray-400">100% Seguro</span>
            </div>
            <div class="flex items-center gap-2">
                <app-svg-icon name="lock" class="w-4 h-4 text-gray-400"></app-svg-icon>
                <span class="text-xs text-gray-400">Sin Virus</span>
            </div>
        </div>
    </div>
</div>
