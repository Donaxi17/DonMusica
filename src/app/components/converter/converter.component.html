<div
    class="min-h-screen bg-gradient-to-br from-zinc-950 via-zinc-900 to-black py-8 px-4 relative overflow-hidden flex items-center justify-center">

    <!-- Efectos de Fondo -->
    <div
        class="absolute top-0 left-0 w-64 h-64 bg-red-600/10 rounded-full blur-[80px] animate-pulse-slow pointer-events-none">
    </div>
    <div class="absolute bottom-0 right-0 w-64 h-64 bg-green-600/10 rounded-full blur-[80px] animate-pulse-slow pointer-events-none"
        style="animation-delay: 2s;"></div>

    <div class="w-full max-w-2xl relative z-10">
        <!-- Header -->
        <div class="text-center mb-8 animate-fade-in">
            <div
                class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-red-600 to-red-800 rounded-2xl mb-4 shadow-xl shadow-red-600/20">
                <app-svg-icon name="youtube" class="text-white w-10 h-10"></app-svg-icon>
            </div>
            <h1
                class="text-4xl md:text-5xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-white via-gray-200 to-gray-400">
                Convertidor MP3
            </h1>
            <p class="text-gray-400 text-lg max-w-md mx-auto">
                Convierte videos de YouTube a MP3 directamente
            </p>
        </div>

        <!-- Tarjeta Principal -->
        <div class="bg-zinc-900/80 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl mb-6">

            <!-- Input URL -->
            <form (submit)="$event.preventDefault(); convert()" class="mb-6">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">
                    🔗 URL del Video
                </label>
                <div class="relative">
                    <input type="text" [(ngModel)]="youtubeUrl" name="youtube_url"
                        placeholder="https://youtube.com/watch?v=..." [disabled]="isLoading"
                        class="w-full bg-black/50 border border-white/10 rounded-2xl px-5 py-4 text-lg text-white placeholder-gray-600 focus:border-red-500/50 focus:ring-2 focus:ring-red-500/20 outline-none transition-all disabled:opacity-50">

                    <button *ngIf="youtubeUrl && !isLoading" (click)="clearForm(); $event.preventDefault()"
                        type="button"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white p-2 rounded-full hover:bg-white/10">
                        <app-svg-icon name="x" class="w-5 h-5"></app-svg-icon>
                    </button>
                </div>
            </form>

            <!-- Botón Convertir -->
            <button *ngIf="!showResult" (click)="convert()" [disabled]="!youtubeUrl || isLoading"
                class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-4 rounded-2xl transition-all transform active:scale-[0.98] shadow-lg shadow-red-600/20 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3">
                <ng-container *ngIf="!isLoading">
                    <app-svg-icon name="cloud-download" class="w-6 h-6"></app-svg-icon>
                    Convertir a MP3
                </ng-container>
                <ng-container *ngIf="isLoading">
                    <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    Procesando...
                </ng-container>
            </button>

            <!-- Error -->
            <div *ngIf="error"
                class="mt-4 p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-center text-sm">
                {{ error }}
            </div>

            <!-- Resultado -->
            <div *ngIf="showResult" class="mt-6 animate-fade-in-up">
                <div class="bg-black/40 border border-green-500/20 rounded-2xl p-6 text-center">
                    <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <app-svg-icon name="check" class="text-green-500 w-8 h-8"></app-svg-icon>
                    </div>
                    <h3 class="text-white font-bold text-lg mb-2">{{ fileName }}</h3>
                    <p class="text-green-400 text-sm mb-6">¡Tu archivo está listo!</p>

                    <button (click)="download()"
                        class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-green-600/20 transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2">
                        <app-svg-icon name="download" class="w-5 h-5"></app-svg-icon>
                        Descargar Ahora
                    </button>

                    <button (click)="clearForm()" class="mt-4 text-gray-500 hover:text-white text-sm">
                        Convertir otro video
                    </button>
                </div>
            </div>
        </div>

        <!-- Features -->
        <div class="grid grid-cols-3 gap-4 opacity-70">
            <div class="bg-zinc-900/30 backdrop-blur rounded-xl p-4 text-center border border-white/5">
                <app-svg-icon name="shield" class="text-green-500 mb-2 mx-auto w-6 h-6"></app-svg-icon>
                <p class="text-xs text-gray-300 uppercase tracking-wide">Sin Publicidad</p>
            </div>
            <div class="bg-zinc-900/30 backdrop-blur rounded-xl p-4 text-center border border-white/5">
                <app-svg-icon name="zap" class="text-yellow-500 mb-2 mx-auto w-6 h-6"></app-svg-icon>
                <p class="text-xs text-gray-300 uppercase tracking-wide">Rápido</p>
            </div>
            <div class="bg-zinc-900/30 backdrop-blur rounded-xl p-4 text-center border border-white/5">
                <app-svg-icon name="star" class="text-purple-500 mb-2 mx-auto w-6 h-6"></app-svg-icon>
                <p class="text-xs text-gray-300 uppercase tracking-wide">Gratis</p>
            </div>
        </div>
    </div>
</div>
