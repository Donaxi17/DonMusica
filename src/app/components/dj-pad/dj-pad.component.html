<div
    class="min-h-screen bg-zinc-950 flex flex-col items-center justify-center p-2 relative overflow-hidden select-none font-sans">

    <!-- Background Effects -->
    <div
        class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-zinc-900 via-zinc-950 to-black pointer-events-none">
    </div>

    <!-- Main Container -->
    <div class="relative z-10 w-full max-w-xl flex flex-col gap-4 animate-fade-in-down">

        <!-- Header & Controls -->
        <div class="flex flex-wrap items-center justify-between gap-2 px-2">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-white tracking-tighter">DJ ZONE <span
                        class="text-[9px] font-normal text-zinc-600 align-super ml-0.5">PRO</span></h1>
            </div>

            <div class="flex items-center gap-2">
                <!-- Grid Size Selector (2, 3, 4, 5) -->
                <div class="flex bg-zinc-900 rounded-lg p-0.5 border border-white/5">
                    <button *ngFor="let size of [2,3,4,5]" (click)="setGridSize(size)"
                        [class.bg-zinc-700]="gridSize === size" [class.text-white]="gridSize === size"
                        class="w-6 h-6 md:w-5 md:h-5 flex items-center justify-center rounded text-[10px] font-bold text-zinc-500 hover:text-white transition-colors">
                        {{size}}
                    </button>
                    <span
                        class="text-[8px] text-zinc-600 flex items-center ml-1 px-1 uppercase tracking-wider">GRID</span>
                </div>

                <!-- Edit Toggle Button -->
                <button (click)="toggleEditMode()" [class.bg-emerald-500]="isEditing" [class.text-black]="isEditing"
                    [class.bg-zinc-800]="!isEditing" [class.text-zinc-400]="!isEditing"
                    class="px-3 py-1.5 rounded-lg font-bold text-[9px] md:text-[10px] uppercase tracking-wider transition-all hover:scale-105 active:scale-95 shadow-lg flex items-center gap-1 border border-white/5">

                    <span *ngIf="isEditing" class="hidden md:inline">Guardar (Enter)</span>
                    <span *ngIf="isEditing" class="md:hidden">Guardar</span>

                    <span *ngIf="!isEditing" class="hidden md:inline">Editar Teclas</span>
                    <span *ngIf="!isEditing" class="md:hidden">Editar</span>

                    <span [class.animate-pulse]="isEditing" class="w-1.5 h-1.5 rounded-full"
                        [class.bg-black]="isEditing" [class.bg-emerald-500]="!isEditing"></span>
                </button>
            </div>
        </div>

        <!-- The Grid -->
        <div [style.grid-template-columns]="'repeat(' + (gridSize || 4) + ', 1fr)'"
            class="grid gap-1.5 md:gap-2 bg-zinc-900/40 p-1.5 md:p-2 rounded-xl border border-white/5 backdrop-blur-xl shadow-2xl transition-all duration-300">

            <div *ngFor="let pad of pads" class="relative group-pad">

                <input type="file" [id]="'upload-' + pad.id" (change)="onFileSelected($event, pad.id)" accept="audio/*"
                    class="hidden">

                <!-- MAIN PAD BUTTON -->
                <button (mousedown)="selectPadForEditing(pad, $event)"
                    (touchstart)="selectPadForEditing(pad, $event); $event.preventDefault()"
                    [style.borderColor]="isEditing && editingPadId === pad.id ? '#10b981' : (pad.active ? getPadColorHex(pad.color) : 'rgba(255,255,255,0.1)')"
                    [style.backgroundColor]="pad.active ? getPadColorHex(pad.color) + '40' : getPadColorHex(pad.color) + '10'"
                    [style.boxShadow]="pad.active ? '0 0 20px ' + getPadColorHex(pad.color) : 'none'" [ngClass]="[
                        isEditing && editingPadId === pad.id ? 'ring-1 ring-emerald-500 animate-pulse' : '',
                        pad.active ? 'scale-95 brightness-125' : 'hover:bg-opacity-20',
                        'w-full aspect-square rounded-lg border transition-all duration-75 flex flex-col items-center justify-center overflow-hidden relative active:scale-95'
                    ]">

                    <!-- Inner Color Tint -->
                    <div [style.backgroundColor]="getPadColorHex(pad.color)"
                        class="absolute inset-0 opacity-5 pointer-events-none"></div>

                    <!-- Key (Adaptive Size) -->
                    <span [ngClass]="{
                        'text-4xl': gridSize === 2,
                        'text-3xl': gridSize === 3,
                        'text-2xl': gridSize === 4,
                        'text-xl': gridSize === 5
                    }" class="font-black text-white/40 select-none pointer-events-none transition-all drop-shadow-md">
                        {{ pad.key }}
                    </span>

                    <!-- Label -->
                    <span [ngClass]="{
                         'opacity-0': isEditing, 
                         'text-[10px]': gridSize <= 3,
                         'text-[9px]': gridSize === 4,
                         'text-[8px]': gridSize === 5
                    }"
                        class="absolute bottom-1 font-bold tracking-widest text-zinc-400 uppercase transition-all pointer-events-none truncate max-w-[90%] opacity-60">
                        {{ pad.label }}
                    </span>

                </button>

                <!-- Edit Mode Controls (Replaced with SVG Icons, Transparent BG) -->
                <div *ngIf="isEditing" class="contents">

                    <!-- Top Left: Sound -->
                    <button (click)="openSettings(pad.id, 'sounds', $event)"
                        class="absolute top-0 left-0 m-1 w-6 h-6 flex items-center justify-center text-zinc-400 hover:text-white bg-black/40 hover:bg-black/80 rounded-full transition-all backdrop-blur-sm z-20 group"
                        title="Elegir Sonido">
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
                        </svg>
                    </button>

                    <!-- Top Right: Color -->
                    <button (click)="openSettings(pad.id, 'colors', $event)"
                        class="absolute top-0 right-0 m-1 w-6 h-6 flex items-center justify-center text-zinc-400 hover:text-white bg-black/40 hover:bg-black/80 rounded-full transition-all backdrop-blur-sm z-20"
                        title="Elegir Color">
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                        </svg>
                    </button>

                    <!-- Bottom Right: Upload -->
                    <button (click)="triggerUpload(pad.id, $event)"
                        class="absolute bottom-0 right-0 m-1 w-6 h-6 flex items-center justify-center text-zinc-400 hover:text-emerald-400 bg-black/40 hover:bg-black/80 rounded-full transition-all backdrop-blur-sm z-20"
                        title="Subir Archivo">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <!-- CONFIGURATION MODAL (Sin cambios, es perfecto) -->
        <div *ngIf="activeModalForPadId !== null"
            class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/80 backdrop-blur-md animate-fade-in"
            (click)="closeModal()">
            <div class="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl relative flex flex-col max-h-[70vh]"
                (click)="$event.stopPropagation()">

                <button (click)="closeModal()"
                    class="absolute top-0 right-0 text-zinc-500 hover:text-white z-10 p-3 bg-zinc-900/80 rounded-bl-xl hover:bg-red-500/20">✕</button>

                <div class="flex border-b border-zinc-800 shrink-0">
                    <button (click)="activeModalTab = 'sounds'" [class.bg-zinc-800]="activeModalTab === 'sounds'"
                        [class.text-white]="activeModalTab === 'sounds'"
                        class="flex-1 py-4 text-xs font-bold uppercase tracking-wider text-zinc-400 hover:text-white transition-colors">
                        Sonidos
                    </button>
                    <button (click)="activeModalTab = 'colors'" [class.bg-zinc-800]="activeModalTab === 'colors'"
                        [class.text-white]="activeModalTab === 'colors'"
                        class="flex-1 py-4 text-xs font-bold uppercase tracking-wider text-zinc-400 hover:text-white transition-colors">
                        Colores
                    </button>
                </div>

                <div class="p-3 overflow-y-auto no-scrollbar bg-zinc-950 flex-1">

                    <div *ngIf="activeModalTab === 'sounds'" class="space-y-2">
                        <div *ngFor="let preset of SOUND_PRESETS"
                            class="flex items-center gap-2 w-full p-2 rounded-lg border border-zinc-800 bg-zinc-900/40 hover:bg-zinc-900 transition-colors group">

                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-sm text-zinc-300 truncate">{{ preset.label }}</div>
                                <div class="text-[9px] text-zinc-500 uppercase tracking-widest">{{ preset.category }}
                                </div>
                            </div>

                            <div class="flex items-center gap-1">
                                <button (click)="previewSound(preset.id, $event)"
                                    class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-indigo-600 hover:border-indigo-400 transition-all active:scale-95"
                                    title="Escuchar">
                                    <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z" />
                                    </svg>
                                </button>

                                <button (click)="selectSound(activeModalForPadId!, preset.id, preset.label, $event)"
                                    class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-emerald-600 hover:border-emerald-400 transition-all active:scale-95"
                                    title="Seleccionar">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div *ngIf="activeModalTab === 'colors'" class="grid grid-cols-5 gap-3 p-1">
                        <button *ngFor="let color of AVAILABLE_COLORS"
                            (click)="selectColor(activeModalForPadId!, color.id)" [style.backgroundColor]="color.hex"
                            class="w-full aspect-square rounded-full shadow-lg hover:scale-110 transition-all ring-2 ring-transparent hover:ring-white"></button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
