<div class="fixed top-0 left-0 w-full h-1 z-[100] pointer-events-none">
    <div class="h-full bg-gradient-to-r from-emerald-500 to-green-400 transition-all duration-150 ease-out shadow-[0_0_10px_rgba(16,185,129,0.5)]"
        [style.width.%]="scrollProgress"></div>
</div>

<!-- Route Loading Overlay -->
<div *ngIf="isLoadingRoute"
    class="fixed inset-0 bg-[#09090b]/80 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center animate-fade-in">
    <div class="relative w-16 h-16 mb-4">
        <div class="absolute inset-0 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin">
        </div>
        <div class="absolute inset-4 bg-emerald-500/10 rounded-full animate-pulse">
        </div>
    </div>
    <span class="text-emerald-400 font-bold text-sm tracking-widest uppercase animate-pulse">{{
        languageService.get('layout.loading') }}</span>
</div>
<div class="min-h-screen bg-zinc-950 text-white flex flex-col">

    <!-- Skip Links for Accessibility -->
    <a href="#main-content"
        class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[100] focus:px-4 focus:py-2 focus:bg-emerald-500 focus:text-black focus:rounded-lg focus:font-bold">
        Saltar al contenido principal
    </a>
    <a href="#navigation"
        class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-48 focus:z-[100] focus:px-4 focus:py-2 focus:bg-emerald-500 focus:text-black focus:rounded-lg focus:font-bold">
        Saltar a navegación
    </a>

    <!-- HEADER DESKTOP (Sticky) -->
    <header class="border-b border-zinc-800 bg-black/80 backdrop-blur-md sticky top-0 z-[2500]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">

            <!-- Logo -->
            <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text text-transparent cursor-pointer hover:opacity-80 transition-opacity"
                (click)="navigateTo('/')">
                DonMusica
            </h1>

            <!-- Desktop Nav -->
            <nav id="navigation" class="hidden md:flex items-center gap-4">
                <button (click)="navigateTo('/')" class="relative px-3 py-2 transition-all duration-300 group"
                    [class.text-white]="isActive('/')" [class.text-zinc-500]="!isActive('/')" aria-label="Ir a Inicio">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="currentColor"
                            viewBox="0 0 24 24">
                            <path
                                d="M3 13h1v7c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-7h1a1 1 0 0 0 .707-1.707l-9-9a.999.999 0 0 0-1.414 0l-9 9A1 1 0 0 0 3 13z" />
                        </svg>
                        <span class="text-sm font-bold tracking-tight">{{ languageService.get('nav.home') }}</span>
                    </div>
                    <!-- Indicator bar -->
                    <div *ngIf="isActive('/')"
                        class="absolute -bottom-[1.15rem] left-0 right-0 h-1 bg-emerald-500 rounded-t-full shadow-[0_0_15px_rgba(16,185,129,0.5)] animate-fade-in">
                    </div>
                </button>

                <button (click)="navigateTo('/artists')" class="relative px-3 py-2 transition-all duration-300 group"
                    [class.text-white]="isArtistActive()" [class.text-zinc-500]="!isArtistActive()"
                    aria-label="Ir a Artistas">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="currentColor"
                            viewBox="0 0 24 24">
                            <path
                                d="M6 18.573c2.206 0 4-1.794 4-4V4.428L19 7.7v7.43a3.953 3.953 0 0 0-2-.557c-2.206 0-4 1.794-4 4s1.794 4 4 4 4-1.794 4-4V7a.998.998 0 0 0-.658-.939l-11-4A.999.999 0 0 0 8 3v8.13a3.953 3.953 0 0 0-2-.557c-2.206 0-4 1.794-4 4s1.794 4 4 4z" />
                        </svg>
                        <span class="text-sm font-bold tracking-tight">{{ languageService.get('nav.artists') }}</span>
                    </div>
                    <!-- Indicator bar -->
                    <div *ngIf="isArtistActive()"
                        class="absolute -bottom-[1.15rem] left-0 right-0 h-1 bg-emerald-500 rounded-t-full shadow-[0_0_15px_rgba(16,185,129,0.5)] animate-fade-in">
                    </div>
                </button>

                <button (click)="navigateTo('/browse')" class="relative px-3 py-2 transition-all duration-300 group"
                    [class.text-white]="isBrowseActive()" [class.text-zinc-500]="!isBrowseActive()"
                    aria-label="Ir a Explorar">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="currentColor"
                            viewBox="0 0 24 24">
                            <path
                                d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z M12 10.999c-.552 0-1 .448-1 1s.448 1 1 1 1-.448 1-1-.448-1-1-1zm-2.121-1.414l-1.414 1.414 3.535 3.535 1.414-1.414-3.535-3.535z" />
                        </svg>
                        <span class="text-sm font-bold tracking-tight">{{ languageService.get('nav.explore') }}</span>
                    </div>
                    <!-- Indicator bar -->
                    <div *ngIf="isBrowseActive()"
                        class="absolute -bottom-[1.15rem] left-0 right-0 h-1 bg-emerald-500 rounded-t-full shadow-[0_0_15px_rgba(16,185,129,0.5)] animate-fade-in">
                    </div>
                </button>

                <button (click)="navigateTo('/videos')" class="relative px-3 py-2 transition-all duration-300 group"
                    [class.text-white]="isActive('/videos')" [class.text-zinc-500]="!isActive('/videos')"
                    aria-label="Ir a Videos">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="currentColor"
                            viewBox="0 0 24 24">
                            <path
                                d="M18 7c0-1.103-.897-2-2-2H4c-1.103 0-2 .897-2 2v10c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-3.333L22 17V7l-4 3.333V7z" />
                        </svg>
                        <span class="text-sm font-bold tracking-tight">{{ languageService.get('nav.videos') }}</span>
                    </div>
                    <!-- Indicator bar -->
                    <div *ngIf="isActive('/videos')"
                        class="absolute -bottom-[1.15rem] left-0 right-0 h-1 bg-red-500 rounded-t-full shadow-[0_0_15px_rgba(239,68,68,0.5)] animate-fade-in">
                    </div>
                </button>

                <!-- Language Selector (Desktop) -->
                <div class="relative ml-2">
                    <button (click)="toggleLanguageMenu($event)" aria-label="Cambiar idioma"
                        class="px-3 py-2 rounded-full hover:bg-white/10 text-zinc-400 hover:text-white transition-colors flex items-center gap-2 text-sm font-medium">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm7.931 9h-2.764a14.67 14.67 0 0 0-1.792-6.243A8.013 8.013 0 0 1 19.931 11zM12.53 4.027c1.035 1.364 2.427 3.78 2.627 6.973H9.03c.139-2.596.994-5.028 2.451-6.974.172-.01.344-.026.519-.026.179 0 .354.016.53.027zm-3.842.7C7.704 6.618 7.136 8.762 7.03 11H4.069a8.013 8.013 0 0 1 4.619-6.273zM4.069 13h2.974c.136 2.379.665 4.478 1.556 6.23A8.01 8.01 0 0 1 4.069 13zm7.381 6.973C10.049 18.275 9.222 15.896 9.041 13h6.113c-.208 2.773-1.117 5.196-2.603 6.972-.182.012-.364.028-.551.028-.186 0-.367-.016-.55-.027zm4.011-.772c.955-1.794 1.538-3.901 1.691-6.201h2.778a8.005 8.005 0 0 1-4.469 6.201z" />
                        </svg>
                        <span>{{ languageService.currentLanguage().toUpperCase() }}</span>
                        <svg class="w-4 h-4 transition-transform" [class.rotate-180]="showLanguageMenu"
                            fill="currentColor" viewBox="0 0 24 24">
                            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                        </svg>
                    </button>

                    <div *ngIf="showLanguageMenu"
                        class="absolute top-full right-0 mt-2 w-40 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl overflow-hidden py-1 z-50 animate-fade-in origin-top-right">
                        <button (click)="changeLanguage('es'); closeLanguageMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm transition-colors"
                            [class.text-emerald-400]="languageService.currentLanguage() === 'es'"
                            [class.text-zinc-300]="languageService.currentLanguage() !== 'es'">
                            <span class="text-lg">🇪🇸</span>
                            <span class="font-medium">{{ languageService.get('layout.language.es') }}</span>
                            <svg *ngIf="languageService.currentLanguage() === 'es'" class="w-4 h-4 ml-auto"
                                fill="currentColor" viewBox="0 0 24 24">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                            </svg>
                        </button>
                        <button (click)="changeLanguage('en'); closeLanguageMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm transition-colors"
                            [class.text-emerald-400]="languageService.currentLanguage() === 'en'"
                            [class.text-zinc-300]="languageService.currentLanguage() !== 'en'">
                            <span class="text-lg">🇺🇸</span>
                            <span class="font-medium">{{ languageService.get('layout.language.en') }}</span>
                            <svg *ngIf="languageService.currentLanguage() === 'en'" class="w-4 h-4 ml-auto"
                                fill="currentColor" viewBox="0 0 24 24">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- More Menu Desktop -->
                <div class="relative ml-2">
                    <button (click)="toggleMoreMenu($event)" aria-label="Más opciones"
                        class="relative w-10 h-10 flex items-center justify-center rounded-full transition-all duration-300 group"
                        [ngClass]="{
                            'text-white': showMoreMenu || isMoreActive(),
                            'text-zinc-400 hover:bg-white/5': !showMoreMenu && !isMoreActive()
                        }">

                        <!-- Desktop Active Indicator Bar -->
                        <div *ngIf="isMoreActive()"
                            class="absolute -bottom-[1.15rem] left-1 right-1 h-1 bg-white rounded-t-full shadow-[0_0_15px_rgba(255,255,255,0.3)] animate-fade-in">
                        </div>

                        <svg class="w-6 h-6 transition-transform group-hover:scale-110" fill="currentColor"
                            viewBox="0 0 24 24" *ngIf="!showMoreMenu">
                            <path
                                d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z" />
                        </svg>
                        <svg class="w-6 h-6 transition-transform group-hover:scale-110" fill="currentColor"
                            viewBox="0 0 24 24" *ngIf="showMoreMenu">
                            <path
                                d="M18.3 5.71a.996.996 0 0 0-1.41 0L12 10.59 7.11 5.7A.996.996 0 1 0 5.7 7.11L10.59 12 5.7 16.89a.996.996 0 1 0 1.41 1.41L12 13.41l4.89 4.88a.996.996 0 1 0 1.41-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4z" />
                        </svg>
                    </button>

                    <div *ngIf="showMoreMenu"
                        class="absolute top-full right-0 mt-2 w-60 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl overflow-hidden py-1 z-50 animate-fade-in origin-top-right">

                        <button (click)="navigateTo('/tools'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white group">
                            <div
                                class="w-8 h-8 rounded-full bg-indigo-500/10 flex items-center justify-center group-hover:bg-indigo-500/20 text-indigo-400">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                    <path
                                        d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" />
                                </svg>
                            </div>
                            {{ languageService.get('nav.tools') }}
                        </button>
                        <div class="h-px bg-zinc-800 mx-4"></div>


                        <button (click)="navigateTo('/sin-copyright'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm6 9.09c0 4-2.55 7.7-6 8.83-3.45-1.13-6-4.82-6-8.83V6.31l6-2.12 6 2.12v4.78z" />
                            </svg> {{ languageService.get('nav.free_music') }}
                        </button>


                        <button (click)="navigateTo('/playlists'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" />
                            </svg> {{ languageService.get('nav.playlists') }}
                        </button>
                        <button (click)="navigateTo('/saved-lyrics'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-orange-400" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z" />
                            </svg> {{ languageService.get('nav.lyrics') }}
                        </button>
                        <button (click)="navigateTo('/offline-music'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                            </svg> {{ languageService.get('nav.offline') }}
                        </button>
                        <button (click)="navigateTo('/upload-music'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M18 15v3H6v-3H4v3c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-3h-2zM7 9l1.41 1.41L11 7.83V16h2V7.83l2.59 2.58L17 9l-5-5-5 5z" />
                            </svg> {{ languageService.get('nav.upload') }}
                        </button>

                        <button (click)="navigateTo('/radio'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M20 6h-3.17l2.54-2.54-1.42-1.42L15 4.99V3c0-.55-.45-1-1-1s-1 .45-1 1v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM7 18c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm11-3c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm0-3c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1z" />
                            </svg> {{ languageService.get('nav.radio') }}
                        </button>
                        <button (click)="navigateTo('/blog'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-purple-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
                            </svg> {{ languageService.get('nav.blog') }}
                        </button>
                        <button (click)="toggleHistory(); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z" />
                            </svg> {{ languageService.get('nav.history') }}
                        </button>

                        <div class="h-px bg-zinc-800 mx-4"></div>

                        <button (click)="toggleDataSaver(); $event.stopPropagation()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center justify-between text-sm transition-colors group">
                            <div class="flex items-center gap-3">
                                <svg class="w-5 h-5 transition-colors"
                                    [class.text-emerald-400]="settingsService.dataSaver()"
                                    [class.text-zinc-500]="!settingsService.dataSaver()" fill="currentColor"
                                    viewBox="0 0 24 24">
                                    <path
                                        d="M17,8C15.35,8 13.04,9.24 11,11C12.85,12 14.7,13.06 16.25,14.5C18.61,12.42 21,10 21,10C21,10 18.65,8 17,8M3,2C3,2 7,3 9,7C10.13,9.27 10,12 10,12C10,12 7.27,12.13 5,11C1,9 0,5 0,5C0,5 1,4 3,2M12,14C12,14 12,14 12,14C12,14 12,14 12,14M12,14C12,14 12,14 12,14C12,14 12,14 12,14" />
                                </svg>
                                <span [class.text-white]="settingsService.dataSaver()"
                                    [class.text-zinc-400]="!settingsService.dataSaver()">{{
                                    languageService.get('layout.data_saver') }}</span>
                            </div>
                            <div class="w-8 h-4 bg-zinc-700 rounded-full relative transition-colors shadow-inner"
                                [class.bg-emerald-500]="settingsService.dataSaver()">
                                <div class="absolute top-0.5 left-0.5 w-3 h-3 bg-white rounded-full transition-transform shadow-md"
                                    [style.transform]="settingsService.dataSaver() ? 'translateX(1rem)' : 'none'"></div>
                            </div>
                        </button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT (Dynamic Padding) -->
    <main id="main-content" class="flex-1 transition-all duration-300 relative">
        <router-outlet></router-outlet>
    </main>

    <!-- Redes Sociales (Fixed Global) -->
    <app-redes-sociales *ngIf="!showHistory"></app-redes-sociales>

    <!-- FOOTER -->
    <app-footer *ngIf="!shouldHideFooter()"></app-footer>

    <!-- ========================================== -->
    <!-- MOBILE BOTTOM NAVIGATION (Modern Fixed Edge) -->
    <!-- ========================================== -->
    <nav *ngIf="!showHistory && !showMobileMoreMenu"
        class="md:hidden fixed bottom-0 left-0 right-0 bg-black backdrop-blur-3xl border-t border-white/5 z-[2100] pb-[env(safe-area-inset-bottom,20px)] h-[calc(4.4rem+env(safe-area-inset-bottom,20px))] flex justify-between items-center overflow-hidden">

        <button (click)="navigateTo('/')" aria-label="Ir a Inicio"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"
            [class.text-white]="isActive('/')" [class.text-zinc-400]="!isActive('/')">

            <!-- Active Indicator: Full Button Fill + Top Glow -->
            <div *ngIf="isActive('/')"
                class="absolute inset-0 bg-gradient-to-b from-emerald-500/10 to-transparent animate-fade-in pointer-events-none">
                <div
                    class="absolute top-0 left-[12%] right-[12%] h-[3px] bg-emerald-500 rounded-b-full shadow-[0_4px_20px_rgba(16,185,129,1)]">
                </div>
            </div>

            <svg class="w-6 h-6 transition-transform group-active:scale-90" [class.text-emerald-400]="isActive('/')"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M3 13h1v7c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-7h1a1 1 0 0 0 .707-1.707l-9-9a.999.999 0 0 0-1.414 0l-9 9A1 1 0 0 0 3 13z" />
            </svg>
            <span class="text-[10px] font-bold tracking-tight" [class.text-emerald-400]="isActive('/')">{{
                languageService.get('nav.home') }}</span>
        </button>

        <button (click)="navigateTo('/artists')" aria-label="Ir a Artistas"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"
            [class.text-white]="isArtistActive()" [class.text-zinc-400]="!isArtistActive()">

            <div *ngIf="isArtistActive()"
                class="absolute inset-0 bg-gradient-to-b from-purple-500/10 to-transparent animate-fade-in pointer-events-none">
                <div
                    class="absolute top-0 left-[12%] right-[12%] h-[3px] bg-purple-500 rounded-b-full shadow-[0_4px_20px_rgba(168,85,247,1)]">
                </div>
            </div>

            <svg class="w-6 h-6 transition-transform group-active:scale-90" [class.text-purple-400]="isArtistActive()"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.41 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z" />
            </svg>
            <span class="text-[10px] font-bold tracking-tight" [class.text-purple-400]="isArtistActive()">{{

        <button (click)="navigateTo('/browse')" aria-label="Ir a Explorar"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"
            [class.text-white]="isBrowseActive()" [class.text-zinc-400]="!isBrowseActive()">

                class="absolute inset-0 bg-gradient-to-b from-blue-500/10 to-transparent animate-fade-in pointer-events-none">
                <div
                    class="absolute top-0 left-[12%] right-[12%] h-[3px] bg-blue-500 rounded-b-full shadow-[0_4px_20px_rgba(59,130,246,1)]">
                </div>
            </div>

            <svg class="w-6 h-6 transition-transform group-active:scale-90" [class.text-blue-400]="isBrowseActive()"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z M12 10.999c-.552 0-1 .448-1 1s.448 1 1 1 1-.448 1-1-.448-1-1-1zm-2.121-1.414l-1.414 1.414 3.535 3.535 1.414-1.414-3.535-3.535z" />

            <span class="text-[10px] font-bold tracking-tight" [class.text-blue-400]="isBrowseActive()">{{
                languageService.get('nav.explore') }}</span>

        <button (click)="navigateTo('/videos')" aria-label="Ir a Videos"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"
            [class.text-white]="isActive('/videos')" [class.text-zinc-400]="!isActive('/videos')">

            <div *ngIf="isActive('/videos')"
                class="absolute inset-0 bg-gradient-to-b from-red-500/10 to-transparent animate-fade-in pointer-events-none">
                <div
                    class="absolute top-0 left-[12%] right-[12%] h-[3px] bg-red-500 rounded-b-full shadow-[0_4px_20px_rgba(239,68,68,1)]">
                </div>
            </div>

            <svg class="w-6 h-6 transition-transform group-active:scale-90" [class.text-red-400]="isActive('/videos')"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M18 7c0-1.103-.897-2-2-2H4c-1.103 0-2 .897-2 2v10c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-3.333L22 17V7l-4 3.333V7z" />

        <button (click)="toggleMobileMoreMenu($event)" aria-label="Más opciones"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"

            <div *ngIf="showMobileMoreMenu || isMoreActive()"
                class="absolute inset-0 bg-gradient-to-b from-white/10 to-transparent animate-fade-in pointer-events-none">
                <div
                    class="absolute top-0 left-[12%] right-[12%] h-[3px] bg-white rounded-b-full shadow-[0_4px_20px_rgba(255,255,255,0.5)]">

    <!-- ========================================== -->
    <!-- MINI PLAYER -->
    <!-- ========================================== -->
    <div *ngIf="!isActive('/player') && currentSong && !showHistory && !showMobileMoreMenu"
        class="fixed left-2 right-2 md:left-auto md:right-8 md:bottom-8 md:w-96 
               bottom-[calc(4.6rem+env(safe-area-inset-bottom,20px))] 
               rounded-2xl p-2 z-[2050] 
               flex items-center gap-2 md:gap-3 animate-slide-up border overflow-hidden ultra-glass-player touch-none select-none"
        [class.favorite-mode]="isFavorite(currentSong.id || '') || currentSong.isFavorite"
        [style.transform]="'translateX(' + swipeDeltaX + 'px)'"
        [style.transition]="isSwiping ? 'none' : 'transform 0.3s cubic-bezier(0.2, 1, 0.2, 1)'"
        (touchstart)="onSwipeStart($event)" (mousedown)="onSwipeStart($event)">

        <!-- ART PART -> Leads to Player -->
        <div (click)="openPlayer()"
            class="relative w-12 h-12 rounded-lg overflow-hidden bg-zinc-800 flex-shrink-0 shadow-lg flex items-center justify-center cursor-pointer group/art">

            <!-- Robust Image Loading for Mini Player -->
            <img *ngIf="currentSong.img && !imageLoadError" [src]="currentSong.img"
                class="w-full h-full object-cover animate-fade-in group-hover/art:scale-110 transition-transform duration-500"
                (error)="onImageError($event)">

            <!-- Base Fallback Icon (Only if strictly no image) -->
            <div *ngIf="(!currentSong.img && !imageLoadError)" class="w-6 h-6 text-zinc-600">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
                </svg>
            </div>

            <!-- Emergency Safety Fallback (Transparent GIF) -->
            <img *ngIf="imageLoadError"
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                class="w-full h-full object-cover">

            <!-- Overlay when playing -->
            <div *ngIf="isPlaying" class="absolute inset-0 bg-black/40 flex items-center justify-center">
                <div class="flex gap-0.5 items-end h-4">
                    <div class="w-0.5 animate-music-bar-alt"
                        [ngClass]="(currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'bg-red-500' : 'bg-emerald-400'">
                    </div>
                    <div class="w-0.5 animate-music-bar-tall animation-delay-75"
                        [ngClass]="(currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'bg-red-500' : 'bg-emerald-400'">
                    </div>
                    <div class="w-0.5 animate-music-bar animation-delay-150"
                        [ngClass]="(currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'bg-red-500' : 'bg-emerald-400'">
                    </div>
                    <div class="w-0.5 animate-music-bar-alt"
                        [ngClass]="(currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'bg-red-500' : 'bg-emerald-400'">
                    </div>
                </div>
            </div>
        </div>

        <!-- TEXT PART -> Leads to Artist Detail / Context -->
        <div class="flex-1 min-w-0 flex flex-col justify-center cursor-pointer group/text"
            (click)="goToArtistDetail($event)">
            <p
                class="text-xs md:text-sm font-bold truncate text-white leading-tight mb-0.5 group-hover/text:text-emerald-400 transition-colors">
                {{currentSong.title}}
            </p>
            <p
                class="text-[10px] md:text-xs text-zinc-400 truncate flex items-center gap-1 hover:text-emerald-400 transition-colors">
                {{currentSong.artist}}
                <span *ngIf="isFavoritesPlaying" class="w-1.5 h-1.5 rounded-full bg-red-500 inline-block ml-1"></span>
            </p>

            <!-- Context Label -->
            <p *ngIf="getContextLabel()"
                class="text-[9px] uppercase tracking-wider font-black mt-0.5 opacity-80 truncate"
                [ngClass]="(currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'text-rose-400' : 'text-emerald-500'">
                {{getContextLabel()}}
            </p>
        </div>

        <!-- CONTROLS -->
        <div class="flex items-center gap-1 md:gap-2 shrink-0" (click)="$event.stopPropagation()">
            <button (click)="previousTrack()" aria-label="Canción anterior"
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 text-zinc-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M16 7v10l-7-5zm-7 10V7h2v10z" />
                </svg>
            </button>
            <button (click)="togglePlayPause()" aria-label="Reproducir o pausar"
                class="w-10 h-10 flex items-center justify-center rounded-full bg-white text-black hover:scale-105 active:scale-95 transition-all shadow-lg">
                <svg class="w-6 h-6 ml-0.5" fill="currentColor" viewBox="0 0 24 24" *ngIf="!isPlaying">
                    <path d="M7 6v12l10-6z" />
                </svg>
                <svg class="w-6 h-6 ml-0.5" fill="currentColor" viewBox="0 0 24 24" *ngIf="isPlaying">
                    <path d="M6 4h4v16H6zm8 0h4v16h-4z" />
                </svg>
            </button>
            <button (click)="nextTrack()" aria-label="Siguiente canción"
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 text-zinc-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M7 7v10l7-5zm9 10V7h-2v10z" />
                </svg>
            </button>
            <button (click)="closePlayer()" aria-label="Cerrar reproductor"
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 text-zinc-500 hover:text-red-400 transition-colors ml-0.5"
                title="Cerrar">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M18.3 5.71a.996.996 0 0 0-1.41 0L12 10.59 7.11 5.7A.996.996 0 1 0 5.7 7.11L10.59 12 5.7 16.89a.996.996 0 1 0 1.41 1.41L12 13.41l4.89 4.88a.996.996 0 1 0 1.41-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4z" />
                </svg>
            </button>
        </div>

        <!-- PROGRESS BAR (Fixed to Top Edge) -->
        <div #progressBarRef class="absolute top-0 left-0 right-0 h-4 z-50 cursor-pointer touch-none group/progress"
            (mousedown)="startDrag($event)" (touchstart)="startDrag($event)">

            <!-- Visual Bar (Pinned to top-0) -->
            <div
                class="absolute top-0 left-0 right-0 h-[3.5px] bg-white/10 group-hover/progress:h-[5px] transition-all">
                <!-- Progress Fill -->
                <div class="h-full relative shadow-[0_4px_10px_rgba(0,0,0,0.3)]" [class.transition-all]="!isDragging"
                    [class.duration-100]="!isDragging" [class.ease-linear]="!isDragging" [ngClass]="[
                        (currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'bg-red-500' : 'bg-emerald-500',
                        isDragging ? 'shadow-[0_0_15px_rgba(16,185,129,0.5)]' : ''
                    ]" [style.width.%]="progress">

                    <!-- Magnetic Thumb -->
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-white shadow-xl 
                                opacity-0 group-hover/progress:opacity-100 transition-all duration-200
                                scale-0 group-hover/progress:scale-100" [class.opacity-100]="isDragging"
                        [class.scale-125]="isDragging">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MOBILE MORE MENU -->

                            <path
                                d="M20 6h-3.17l2.54-2.54-1.42-1.42L15 4.99V3c0-.55-.45-1-1-1s-1 .45-1 1v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM7 18c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm11-3c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm0-3c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1z" />

                    <button (click)="navigateTo('/playlists'); closeMobileMoreMenu()"

                    <button (click)="navigateTo('/blog'); closeMobileMoreMenu()"

                            <path
                                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />

                        <span class="text-sm font-bold" [class.text-purple-400]="isActive('/blog')"

                    <button (click)="navigateTo('/saved-lyrics'); closeMobileMoreMenu()"

                    </button>

                    <button (click)="navigateTo('/tools'); closeMobileMoreMenu()"
                        class="col-span-2 bg-gradient-to-r from-indigo-900/40 to-purple-900/40 border border-indigo-500/20 p-3 rounded-2xl flex items-center justify-center gap-3 hover:from-indigo-900/60 hover:to-purple-900/60 transition-all group mt-1">
                        <div class="p-1.5 bg-indigo-500/20 rounded-full group-hover:scale-110 transition-transform">

                                </svg>

                        <div class="w-10 h-5 bg-zinc-800 rounded-full relative transition-colors shadow-inner border border-white/5"
                            [class.bg-emerald-500]="settingsService.dataSaver()">
                            <div class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform shadow-md"
                                [style.transform]="settingsService.dataSaver() ? 'translateX(1.25rem)' : 'none'"></div>
                        </div>
                    </div>

                    <div class="col-span-2 bg-zinc-800 p-1.5 rounded-2xl flex items-center justify-between gap-1 mt-2">
                        <button (click)="changeLanguage('ES'); closeMobileMoreMenu()"
                            class="flex-1 py-1 px-4 rounded-xl flex items-center justify-center gap-2 transition-all border border-transparent"
                            [ngClass]="{
                                'bg-emerald-500/10 border-emerald-500/30 text-emerald-400': currentLanguage === 'ES',
                                'text-zinc-500 hover:bg-zinc-700': currentLanguage !== 'ES'
                            }">
                            <span class="text-lg">🇪🇸</span>
                            <span class="text-xs font-bold uppercase tracking-wider">{{
                                languageService.get('layout.language.es') }}</span>
                        </button>
                        <div class="w-px h-6 bg-zinc-700/50"></div>
                        <button (click)="changeLanguage('EN'); closeMobileMoreMenu()"
                            class="flex-1 py-1 px-4 rounded-xl flex items-center justify-center gap-2 transition-all border border-transparent"
                            [ngClass]="{
                                'bg-emerald-500/10 border-emerald-500/30 text-emerald-400': currentLanguage === 'EN',
                                'text-zinc-500 hover:bg-zinc-700': currentLanguage !== 'EN'
                            }">
                            <span class="text-lg">🇺🇸</span>
                            <span class="text-xs font-bold uppercase tracking-wider">{{
                                languageService.get('layout.language.en') }}</span>
                        </button>
                    </div>
                </div>
            </div>

            <button (click)="closeMobileMoreMenu()"
                class="w-full py-5 text-center text-zinc-400 font-medium border-t border-white/5 hover:bg-white/5 active:bg-white/10 pb-10">{{
                languageService.get('layout.close') }}</button>
        </div>
    </div>

    <!-- HISTORY PANEL (SHARED) -->
    <app-recently-played *ngIf="showHistory"></app-recently-played>

    <!-- GLOBAL VIDEO PLAYER -->
    <app-video-player></app-video-player>

    <!-- Back to Top Button -->
    <button *ngIf="showBackToTop" (click)="scrollToTop()" [ngClass]="currentSong ? 'bottom-36' : 'bottom-20'"
        aria-label="Volver arriba"
        class="fixed md:bottom-4 right-2 z-[3000] w-7 h-7 md:w-9 md:h-9 bg-emerald-500/20 backdrop-blur-xl border border-emerald-500/30 text-emerald-500 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:bg-emerald-500 hover:text-black hover:scale-110 active:scale-95 transition-all duration-300 animate-fade-in-up">
        <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7" />
        </svg>
    </button>
</div>
