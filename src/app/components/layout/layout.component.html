<div class="min-h-screen bg-zinc-950 text-white flex flex-col">

    <!-- Skip Links for Accessibility -->
    <a href="#main-content"
        class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[100] focus:px-4 focus:py-2 focus:bg-emerald-500 focus:text-black focus:rounded-lg focus:font-bold">
        Saltar al contenido principal
    </a>
    <a href="#navigation"
        class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-48 focus:z-[100] focus:px-4 focus:py-2 focus:bg-emerald-500 focus:text-black focus:rounded-lg focus:font-bold">
        Saltar a navegación
    </a>

    <!-- HEADER DESKTOP (Sticky) -->
    <header class="border-b border-zinc-800 bg-black/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">

            <!-- Logo -->
            <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text text-transparent cursor-pointer hover:opacity-80 transition-opacity"
                (click)="navigateTo('/')">
                DonMusica
            </h1>

            <!-- Desktop Nav -->
            <nav id="navigation" class="hidden md:flex items-center gap-1">
                <button (click)="navigateTo('/')" [class.text-emerald-400]="isActive('/')"
                    [class.text-zinc-400]="!isActive('/')"
                    class="px-4 py-2 rounded-full hover:bg-white/5 transition-colors text-sm font-medium hover:text-white flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M3 13h1v7c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-7h1a1 1 0 0 0 .707-1.707l-9-9a.999.999 0 0 0-1.414 0l-9 9A1 1 0 0 0 3 13z" />
                    </svg>
                    Inicio
                </button>
                <button (click)="navigateTo('/artists')" [class.text-emerald-400]="isActive('/artists')"
                    [class.text-zinc-400]="!isActive('/artists')"
                    class="px-4 py-2 rounded-full hover:bg-white/5 transition-colors text-sm font-medium hover:text-white flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M6 18.573c2.206 0 4-1.794 4-4V4.428L19 7.7v7.43a3.953 3.953 0 0 0-2-.557c-2.206 0-4 1.794-4 4s1.794 4 4 4 4-1.794 4-4V7a.998.998 0 0 0-.658-.939l-11-4A.999.999 0 0 0 8 3v8.13a3.953 3.953 0 0 0-2-.557c-2.206 0-4 1.794-4 4s1.794 4 4 4z" />
                    </svg>
                    Artistas
                </button>
                <button (click)="navigateTo('/browse')" [class.text-emerald-400]="isActive('/browse')"
                    [class.text-zinc-400]="!isActive('/browse')"
                    class="px-4 py-2 rounded-full hover:bg-white/5 transition-colors text-sm font-medium hover:text-white flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z M12 10.999c-.552 0-1 .448-1 1s.448 1 1 1 1-.448 1-1-.448-1-1-1zm-2.121-1.414l-1.414 1.414 3.535 3.535 1.414-1.414-3.535-3.535z" />
                    </svg> Explorar
                </button>
                <button (click)="navigateTo('/videos')" [class.text-red-400]="isActive('/videos')"
                    [class.text-zinc-400]="!isActive('/videos')"
                    class="px-4 py-2 rounded-full hover:bg-white/5 transition-colors text-sm font-medium hover:text-white flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M18 7c0-1.103-.897-2-2-2H4c-1.103 0-2 .897-2 2v10c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-3.333L22 17V7l-4 3.333V7z" />
                    </svg> Videos
                </button>

                <!-- Language Selector (Desktop) -->
                <div class="relative ml-2">
                    <button (click)="toggleLanguageMenu($event)"
                        class="px-3 py-2 rounded-full hover:bg-white/10 text-zinc-400 hover:text-white transition-colors flex items-center gap-2 text-sm font-medium">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm7.931 9h-2.764a14.67 14.67 0 0 0-1.792-6.243A8.013 8.013 0 0 1 19.931 11zM12.53 4.027c1.035 1.364 2.427 3.78 2.627 6.973H9.03c.139-2.596.994-5.028 2.451-6.974.172-.01.344-.026.519-.026.179 0 .354.016.53.027zm-3.842.7C7.704 6.618 7.136 8.762 7.03 11H4.069a8.013 8.013 0 0 1 4.619-6.273zM4.069 13h2.974c.136 2.379.665 4.478 1.556 6.23A8.01 8.01 0 0 1 4.069 13zm7.381 6.973C10.049 18.275 9.222 15.896 9.041 13h6.113c-.208 2.773-1.117 5.196-2.603 6.972-.182.012-.364.028-.551.028-.186 0-.367-.016-.55-.027zm4.011-.772c.955-1.794 1.538-3.901 1.691-6.201h2.778a8.005 8.005 0 0 1-4.469 6.201z" />
                        </svg>
                        <span>{{ currentLanguage }}</span>
                        <svg class="w-4 h-4 transition-transform" [class.rotate-180]="showLanguageMenu"
                            fill="currentColor" viewBox="0 0 24 24">
                            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                        </svg>
                    </button>

                    <div *ngIf="showLanguageMenu"
                        class="absolute top-full right-0 mt-2 w-40 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl overflow-hidden py-1 z-50 animate-fade-in origin-top-right">
                        <button (click)="changeLanguage('ES'); closeLanguageMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm transition-colors"
                            [class.text-emerald-400]="currentLanguage === 'ES'"
                            [class.text-zinc-300]="currentLanguage !== 'ES'">
                            <span class="text-lg">🇪🇸</span>
                            <span class="font-medium">Español</span>
                            <svg *ngIf="currentLanguage === 'ES'" class="w-4 h-4 ml-auto" fill="currentColor"
                                viewBox="0 0 24 24">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                            </svg>
                        </button>
                        <button (click)="changeLanguage('EN'); closeLanguageMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm transition-colors"
                            [class.text-emerald-400]="currentLanguage === 'EN'"
                            [class.text-zinc-300]="currentLanguage !== 'EN'">
                            <span class="text-lg">🇺🇸</span>
                            <span class="font-medium">English</span>
                            <svg *ngIf="currentLanguage === 'EN'" class="w-4 h-4 ml-auto" fill="currentColor"
                                viewBox="0 0 24 24">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- More Menu Desktop -->
                <div class="relative ml-2">
                    <button (click)="toggleMoreMenu($event)"
                        class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-white/10 text-zinc-400 hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" *ngIf="!showMoreMenu">
                            <path
                                d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z" />
                        </svg>
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" *ngIf="showMoreMenu">
                            <path
                                d="M18.3 5.71a.996.996 0 0 0-1.41 0L12 10.59 7.11 5.7A.996.996 0 1 0 5.7 7.11L10.59 12 5.7 16.89a.996.996 0 1 0 1.41 1.41L12 13.41l4.89 4.88a.996.996 0 1 0 1.41-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4z" />
                        </svg>
                    </button>

                    <div *ngIf="showMoreMenu"
                        class="absolute top-full right-0 mt-2 w-60 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl overflow-hidden py-1 z-50 animate-fade-in origin-top-right">

                        <button (click)="navigateTo('/tools'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white group">
                            <div
                                class="w-8 h-8 rounded-full bg-indigo-500/10 flex items-center justify-center group-hover:bg-indigo-500/20 text-indigo-400">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                    <path
                                        d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" />
                                </svg>
                            </div>
                            Herramientas Pro
                        </button>
                        <div class="h-px bg-zinc-800 mx-4"></div>


                        <button (click)="navigateTo('/sin-copyright'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm6 9.09c0 4-2.55 7.7-6 8.83-3.45-1.13-6-4.82-6-8.83V6.31l6-2.12 6 2.12v4.78z" />
                            </svg> Sin Copyright
                        </button>


                        <button (click)="navigateTo('/playlists'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" />
                            </svg> Playlists
                        </button>
                        <button (click)="navigateTo('/saved-lyrics'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-orange-400" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z" />
                            </svg> Letras Guardadas
                        </button>
                        <button (click)="navigateTo('/offline-music'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                            </svg> Música Offline
                        </button>
                        <button (click)="navigateTo('/upload-music'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M18 15v3H6v-3H4v3c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-3h-2zM7 9l1.41 1.41L11 7.83V16h2V7.83l2.59 2.58L17 9l-5-5-5 5z" />
                            </svg> Añadir Música
                        </button>
                        <button (click)="navigateTo('/radio'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M20 6h-3.17l2.54-2.54-1.42-1.42L15 4.99V3c0-.55-.45-1-1-1s-1 .45-1 1v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM7 18c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm11-3c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm0-3c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1z" />
                            </svg> Radio
                        </button>
                        <button (click)="navigateTo('/blog'); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-purple-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
                            </svg> Blog
                        </button>
                        <button (click)="toggleHistory(); closeMoreMenu()"
                            class="w-full text-left px-4 py-3 hover:bg-zinc-800 flex items-center gap-3 text-sm text-zinc-300 hover:text-white">
                            <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z" />
                            </svg> Historial
                        </button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT (Dynamic Padding) -->
    <main id="main-content" class="flex-1 transition-all duration-300 relative z-0" [class.pb-28]="currentSong"
        [class.pb-safe-bottom]="!currentSong" [class.md:pb-0]="true">
        <router-outlet></router-outlet>
    </main>

    <!-- Redes Sociales (Fixed Global) -->
    <app-redes-sociales *ngIf="!showHistory"></app-redes-sociales>

    <!-- FOOTER -->
    <app-footer></app-footer>

    <!-- ========================================== -->
    <!-- MOBILE BOTTOM NAVIGATION (Fixed) -->
    <!-- ========================================== -->
    <nav
        class="md:hidden fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur-2xl border-t border-white/5 z-50 pb-[env(safe-area-inset-bottom,20px)] pt-2 h-[calc(4rem+env(safe-area-inset-bottom,20px))] flex justify-between items-center px-1 md:px-0">

        <button (click)="navigateTo('/')"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"
            [class.text-white]="isActive('/')" [class.text-zinc-500]="!isActive('/')">
            <div *ngIf="isActive('/')"
                class="absolute top-1 w-12 h-8 bg-emerald-500/20 rounded-full -z-10 animate-fade-in"></div>
            <svg class="w-6 h-6 transition-transform group-active:scale-90" [class.text-emerald-400]="isActive('/')"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M3 13h1v7c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-7h1a1 1 0 0 0 .707-1.707l-9-9a.999.999 0 0 0-1.414 0l-9 9A1 1 0 0 0 3 13z" />
            </svg>
            <span class="text-[10px] font-medium tracking-wide">Inicio</span>
        </button>

        <button (click)="navigateTo('/artists')"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"
            [class.text-white]="isActive('/artists')" [class.text-zinc-500]="!isActive('/artists')">
            <div *ngIf="isActive('/artists')"
                class="absolute top-1 w-12 h-8 bg-purple-500/20 rounded-full -z-10 animate-fade-in"></div>
            <svg class="w-6 h-6 transition-transform group-active:scale-90"
                [class.text-purple-400]="isActive('/artists')" fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.41 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z" />
            </svg>
            <span class="text-[10px] font-medium tracking-wide">Artistas</span>
        </button>

        <button (click)="navigateTo('/browse')"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"
            [class.text-white]="isActive('/browse')" [class.text-zinc-500]="!isActive('/browse')">
            <div *ngIf="isActive('/browse')"
                class="absolute top-1 w-12 h-8 bg-blue-500/20 rounded-full -z-10 animate-fade-in"></div>
            <svg class="w-6 h-6 transition-transform group-active:scale-90" [class.text-blue-400]="isActive('/browse')"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z M12 10.999c-.552 0-1 .448-1 1s.448 1 1 1 1-.448 1-1-.448-1-1-1zm-2.121-1.414l-1.414 1.414 3.535 3.535 1.414-1.414-3.535-3.535z" />
            </svg>
            <span class="text-[10px] font-medium tracking-wide">Explorar</span>
        </button>

        <button (click)="navigateTo('/videos')"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"
            [class.text-white]="isActive('/videos')" [class.text-zinc-500]="!isActive('/videos')">
            <div *ngIf="isActive('/videos')"
                class="absolute top-1 w-12 h-8 bg-red-500/20 rounded-full -z-10 animate-fade-in"></div>
            <svg class="w-6 h-6 transition-transform group-active:scale-90" [class.text-red-400]="isActive('/videos')"
                fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M18 7c0-1.103-.897-2-2-2H4c-1.103 0-2 .897-2 2v10c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-3.333L22 17V7l-4 3.333V7z" />
            </svg>
            <span class="text-[10px] font-medium tracking-wide">Videos</span>
        </button>

        <button (click)="toggleMobileMoreMenu($event)"
            class="flex-1 flex flex-col items-center justify-center h-full gap-1 transition-all duration-300 group relative"
            [class.text-white]="showMobileMoreMenu || isMoreActive()"
            [class.text-zinc-500]="!showMobileMoreMenu && !isMoreActive()">
            <div *ngIf="showMobileMoreMenu || isMoreActive()"
                class="absolute top-1 w-12 h-8 bg-zinc-700/50 rounded-full -z-10 animate-fade-in"></div>
            <svg class="w-6 h-6 transition-transform group-active:scale-90" fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M10 3H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zM9 9H5V5h4v4zm11-6h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zm-1 6h-4V5h4v4zm-9 4H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1zm-1 6H5v-4h4v4zm11-6h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1zm-1 6h-4v-4h4v4z" />
            </svg>
            <span class="text-[10px] font-medium tracking-wide">Más</span>
        </button>
    </nav>


    <!-- ========================================== -->
    <!-- MINI PLAYER -->
    <!-- ========================================== -->
    <div *ngIf="!isActive('/player') && currentSong" class="fixed left-2 right-2 md:left-auto md:right-8 md:bottom-8 md:w-96 
               bottom-[calc(3.8rem+env(safe-area-inset-bottom,20px))] 
               backdrop-blur-xl rounded-xl p-2 z-40 
               flex items-center gap-3 shadow-2xl shadow-black/50 animate-slide-up cursor-pointer border"
        [ngClass]="(isFavorite(currentSong.id || '') || currentSong.isFavorite) ? 'bg-rose-950/95 border-rose-500/30' : 'bg-zinc-900/95 border-white/10'"
        (click)="openPlayer()">

        <div
            class="relative w-12 h-12 rounded-lg overflow-hidden bg-zinc-800 flex-shrink-0 shadow-lg flex items-center justify-center">
            <img *ngIf="currentSong.img && !imageLoadError" [src]="currentSong.img" class="w-full h-full object-cover"
                (error)="onImageError($event)">
            <div *ngIf="!currentSong.img || imageLoadError" class="w-6 h-6 text-zinc-600">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
                </svg>
            </div>
            <div *ngIf="isPlaying" class="absolute inset-0 bg-black/30 flex items-center justify-center">
                <div class="flex gap-0.5 items-end h-3">
                    <div class="w-0.5 animate-music-bar"
                        [ngClass]="(currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'bg-red-500' : 'bg-emerald-400'">
                    </div>
                    <div class="w-0.5 animate-music-bar animation-delay-75"
                        [ngClass]="(currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'bg-red-500' : 'bg-emerald-400'">
                    </div>
                    <div class="w-0.5 animate-music-bar animation-delay-150"
                        [ngClass]="(currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'bg-red-500' : 'bg-emerald-400'">
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 min-w-0 flex flex-col justify-center">
            <p class="text-xs md:text-sm font-bold truncate text-white leading-tight mb-0.5">
                {{currentSong.title}}
            </p>
            <p class="text-[10px] md:text-xs text-zinc-400 truncate flex items-center gap-1">
                {{currentSong.artist}}
                <span *ngIf="isFavoritesPlaying" class="w-1.5 h-1.5 rounded-full bg-red-500 inline-block ml-1"></span>
            </p>
        </div>

        <div class="flex items-center gap-1 md:gap-2 mr-1" (click)="$event.stopPropagation()">
            <button (click)="previousTrack()"
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 text-zinc-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M16 7v10l-7-5zm-7 10V7h2v10z" />
                </svg>
            </button>
            <button (click)="togglePlayPause()"
                class="w-10 h-10 flex items-center justify-center rounded-full bg-white text-black hover:scale-105 active:scale-95 transition-all shadow-lg">
                <svg class="w-6 h-6 ml-0.5" fill="currentColor" viewBox="0 0 24 24" *ngIf="!isPlaying">
                    <path d="M7 6v12l10-6z" />
                </svg>
                <svg class="w-6 h-6 ml-0.5" fill="currentColor" viewBox="0 0 24 24" *ngIf="isPlaying">
                    <path d="M6 4h4v16H6zm8 0h4v16h-4z" />
                </svg>
            </button>
            <button (click)="nextTrack()"
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 text-zinc-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M7 7v10l7-5zm9 10V7h-2v10z" />
                </svg>
            </button>
            <button (click)="closePlayer()"
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 text-zinc-500 hover:text-red-400 transition-colors ml-1"
                title="Cerrar">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M18.3 5.71a.996.996 0 0 0-1.41 0L12 10.59 7.11 5.7A.996.996 0 1 0 5.7 7.11L10.59 12 5.7 16.89a.996.996 0 1 0 1.41 1.41L12 13.41l4.89 4.88a.996.996 0 1 0 1.41-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4z" />
                </svg>
            </button>
        </div>

        <!-- PROGRESS BAR (Seek implementation) -->
        <div #progressBarRef
            class="absolute bottom-0 left-0 right-0 h-1 bg-white/10 cursor-pointer hover:h-2 transition-all group z-50 touch-none"
            (mousedown)="startDrag($event)" (touchstart)="startDrag($event)">
            <div class="h-full rounded-r-full relative transition-all duration-100 ease-linear"
                [ngClass]="(currentSong && (isFavorite(currentSong.id || '') || currentSong.isFavorite)) ? 'bg-gradient-to-r from-rose-500 to-red-600' : 'bg-gradient-to-r from-emerald-500 to-green-600'"
                [style.width.%]="progress">
                <!-- Handler handle on hover -->
                <div
                    class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity">
                </div>
            </div>
        </div>
    </div>

    <!-- MOBILE MORE MENU -->
    <div *ngIf="showMobileMoreMenu"
        class="md:hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex flex-col justify-end animate-fade-in"
        (click)="closeMobileMoreMenu()">
        <!-- ... (Contenido del menú móvil sin cambios) ... -->
        <div class="bg-zinc-900 rounded-t-3xl border-t border-zinc-700/50 shadow-2xl overflow-hidden max-h-[80vh] overflow-y-auto"
            (click)="$event.stopPropagation()">
            <div class="flex justify-center pt-3 pb-2 sticky top-0 bg-zinc-900 z-10">
                <div class="w-12 h-1.5 bg-zinc-700/50 rounded-full"></div>
            </div>

            <div class="px-5 pb-8 space-y-2">
                <div class="flex items-center justify-between mb-4 ml-1">
                    <h3 class="text-zinc-400 text-xs font-bold uppercase tracking-wider">Menú Principal</h3>
                    <button (click)="toggleHistory(); closeMobileMoreMenu()"
                        class="text-emerald-400 text-xs font-bold border border-emerald-500/20 px-3 py-1 rounded-full bg-emerald-500/10 hover:bg-emerald-500/20">
                        Ver Historial
                    </button>
                </div>

                <button (click)="navigateTo('/sin-copyright'); closeMobileMoreMenu()" class="menu-item-mobile group">
                    <div
                        class="icon-box bg-emerald-500/10 text-emerald-400 group-hover:bg-emerald-500 group-hover:text-black transition-colors">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M20.995 6.9a.998.998 0 0 0-.548-.795l-8-4a1 1 0 0 0-.895 0l-8 4a1.002 1.002 0 0 0-.547.795c-.011.107-.961 10.767 8.589 15.014a.987.987 0 0 0 .812 0c9.55-4.247 8.6-14.906 8.589-15.014zM12 19.897C5.231 16.625 4.911 9.642 4.966 7.635L12 4.118l7.029 3.515c.037 1.989-.328 9.018-7.029 12.264z" />
                            <path d="m11 12.586-2.293-2.293-1.414 1.414L11 15.414l5.707-5.707-1.414-1.414z" />
                        </svg>
                    </div>
                    <div class="flex-1 font-medium">Sin Copyright</div>
                    <svg class="w-4 h-4 text-zinc-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M10.707 17.707 16.414 12l-5.707-5.707-1.414 1.414L13.586 12l-4.293 4.293z" />
                    </svg>
                </button>



                <div class="grid grid-cols-2 gap-3 mt-4">

                    <button (click)="navigateTo('/radio'); closeMobileMoreMenu()"
                        class="bg-zinc-800 p-4 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-700 transition-colors">
                        <svg class="w-12 h-12 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M20 6h-3.17l2.54-2.54-1.42-1.42L15 4.99V3c0-.55-.45-1-1-1s-1 .45-1 1v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM7 18c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm11-3c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm0-3c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1z" />
                        </svg>
                        <span class="text-sm font-medium">Radio FM</span>
                    </button>
                    <button (click)="navigateTo('/playlists'); closeMobileMoreMenu()"
                        class="bg-zinc-800 p-4 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-700 transition-colors">
                        <svg class="w-12 h-12 text-yellow-400" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" />
                        </svg>
                        <span class="text-sm font-medium">Playlists</span>
                    </button>
                    <button (click)="navigateTo('/blog'); closeMobileMoreMenu()"
                        class="bg-zinc-800 p-4 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-700 transition-colors">
                        <svg class="w-12 h-12 text-purple-400" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
                        </svg>
                        <span class="text-sm font-medium">Blog</span>
                    </button>
                    <button (click)="navigateTo('/saved-lyrics'); closeMobileMoreMenu()"
                        class="bg-zinc-800 p-4 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-700 transition-colors">
                        <svg class="w-12 h-12 text-orange-400" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z" />
                        </svg>
                        <span class="text-sm font-medium">Letras</span>
                    </button>
                    <button (click)="navigateTo('/offline-music'); closeMobileMoreMenu()"
                        class="bg-zinc-800 p-4 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-700 transition-colors">
                        <svg class="w-12 h-12 text-blue-400" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                        </svg>
                        <span class="text-sm font-medium">Offline</span>
                    </button>
                    <button (click)="navigateTo('/upload-music'); closeMobileMoreMenu()"
                        class="bg-zinc-800 p-4 rounded-2xl flex flex-col items-center gap-2 hover:bg-zinc-700 transition-colors">
                        <svg class="w-12 h-12 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M18 15v3H6v-3H4v3c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-3h-2zM7 9l1.41 1.41L11 7.83V16h2V7.83l2.59 2.58L17 9l-5-5-5 5z" />
                        </svg>
                        <span class="text-sm font-medium">Añadir</span>
                    </button>

                    <!-- TOOLS BUTTON (Full Width) -->
                    <button (click)="navigateTo('/tools'); closeMobileMoreMenu()"
                        class="col-span-2 bg-gradient-to-r from-indigo-900/40 to-purple-900/40 border border-indigo-500/20 p-3 rounded-2xl flex items-center justify-center gap-3 hover:from-indigo-900/60 hover:to-purple-900/60 transition-all group mt-1">
                        <div class="p-1.5 bg-indigo-500/20 rounded-full group-hover:scale-110 transition-transform">
                            <svg class="w-5 h-5 text-indigo-300" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" />
                            </svg>
                        </div>
                        <span class="text-sm font-bold text-indigo-200 uppercase tracking-wide">Herramientas Pro</span>
                    </button>

                    <div class="col-span-2 bg-zinc-800 p-1.5 rounded-2xl flex items-center justify-between gap-1 mt-2">
                        <button (click)="changeLanguage('ES'); closeMobileMoreMenu()"
                            class="flex-1 py-3 rounded-xl flex items-center justify-center gap-2 transition-all border border-transparent"
                            [class.bg-emerald-500_10]="currentLanguage === 'ES'"
                            [class.border-emerald-500_30]="currentLanguage === 'ES'"
                            [class.text-emerald-400]="currentLanguage === 'ES'"
                            [class.text-zinc-500]="currentLanguage !== 'ES'"
                            [class.hover:bg-zinc-700]="currentLanguage !== 'ES'">
                            <span class="text-lg">🇪🇸</span>
                            <span class="text-xs font-bold uppercase tracking-wider">Español</span>
                        </button>
                        <div class="w-px h-6 bg-zinc-700/50"></div>
                        <button (click)="changeLanguage('EN'); closeMobileMoreMenu()"
                            class="flex-1 py-3 rounded-xl flex items-center justify-center gap-2 transition-all border border-transparent"
                            [class.bg-emerald-500_10]="currentLanguage === 'EN'"
                            [class.border-emerald-500_30]="currentLanguage === 'EN'"
                            [class.text-emerald-400]="currentLanguage === 'EN'"
                            [class.text-zinc-500]="currentLanguage !== 'EN'"
                            [class.hover:bg-zinc-700]="currentLanguage !== 'EN'">
                            <span class="text-lg">🇺🇸</span>
                            <span class="text-xs font-bold uppercase tracking-wider">English</span>
                        </button>
                    </div>
                </div>
            </div>

            <button (click)="closeMobileMoreMenu()"
                class="w-full py-5 text-center text-zinc-400 font-medium border-t border-white/5 hover:bg-white/5 active:bg-white/10 pb-10">Cerrar</button>
        </div>
    </div>

    <!-- HISTORY PANEL (SHARED) -->
    <app-recently-played *ngIf="showHistory"></app-recently-played>

    <!-- GLOBAL VIDEO PLAYER -->
    <app-video-player></app-video-player>

</div>
