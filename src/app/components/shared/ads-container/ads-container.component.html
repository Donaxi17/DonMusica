<!-- ADSTERRA ADS CONTAINER -->
<div class="w-full my-6 animate-fade-in flex flex-col items-center">

    <!-- Desktop: Native Banner 4:1 (Hidden on Mobile, or if forced iframe) -->
    <div class="hidden md:block w-full" *ngIf="!forceIframe">
        <!-- Always the same ID for Native Banner script -->
        <div id="container-e4e25c107fdc96e794b513ea7c8e2e97"></div>
    </div>

    <!-- Mobile/Iframe: Banner 300x250 (Hidden on Desktop unless forced) -->
    <div class="w-full flex justify-center" [class.md:hidden]="!forceIframe">
        <!-- Dynamic ID for Mobile Iframe -->
        <div [id]="mobileContainerId"></div>
    </div>

</div>
