@if (proService.shouldShowAds()) {
<div class="w-full flex justify-center items-center transition-all duration-500 ease-in-out" [class.py-8]="!noPadding"
    [style.height]="(hasAdContent && !adFailed) ? 'auto' : '0'"
    [style.min-height]="(hasAdContent && !adFailed) ? (smallOnly ? '50px' : '90px') : '0'"
    [style.opacity]="(hasAdContent && !adFailed) ? '1' : '0'" role="complementary">

    <!-- Dynamic Helper Container -->
    <div [id]="mobileContainerId"></div>

</div>
}
