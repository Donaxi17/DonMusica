<div class="fixed inset-0 z-[200] flex items-end sm:items-center justify-center p-0 sm:p-4 md:p-8 animate-fade-in">
    <!-- Blur Backdrop -->
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" (click)="close.emit()"></div>

    <!-- Modal Container -->
    <div
        class="relative w-full max-w-2xl bg-zinc-900 border-t sm:border border-white/10 rounded-t-[2rem] sm:rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col h-[75vh] mb-[72px] sm:mb-0 sm:h-auto sm:max-h-[85vh] animate-slide-up">

        <!-- Header -->
        <div class="px-5 pt-6 pb-3 sm:px-8 sm:pt-8 sm:pb-4 flex items-center justify-between shrink-0">
            <div>
                <h2 class="text-xl sm:text-3xl font-black text-white tracking-tight">Mezcla Inteligente</h2>
                <p class="text-emerald-400 text-[10px] sm:text-sm font-bold uppercase tracking-widest mt-0.5">Género:
                    {{genreName}}</p>
            </div>
            <button (click)="close.emit()"
                class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/10 transition-all">
                <app-svg-icon name="close" width="20" height="20"></app-svg-icon>
            </button>
        </div>

        <!-- Selection Quick Actions -->
        <div
            class="px-5 py-3 sm:px-8 sm:py-4 flex items-center justify-between border-b border-white/5 shrink-0 bg-white/[0.02]">
            <span class="text-zinc-500 text-[10px] sm:text-xs font-bold uppercase tracking-widest">
                {{selectedArtistIds.size}} Seleccionados de {{artists.length}}
            </span>
            <button (click)="toggleAll()"
                class="text-emerald-400 text-[10px] sm:text-xs font-black uppercase tracking-widest hover:text-emerald-300 transition-colors bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                {{ allSelected ? 'Ninguno' : 'Todos' }}
            </button>
        </div>

        <!-- Artist Grid - Optimized for Mobile -->
        <div class="flex-1 overflow-y-auto px-4 py-4 sm:px-6 sm:py-6 custom-scrollbar">
            <div class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 gap-2 sm:gap-3">
                @for (artist of artists; track artist.id) {
                <div (click)="toggleArtist(artist.id)"
                    class="group relative p-2 sm:p-3 rounded-xl sm:rounded-2xl border transition-all duration-300 cursor-pointer select-none flex flex-col items-center text-center space-y-2"
                    [ngClass]="{
                            'bg-emerald-500/10 border-emerald-500/50 scale-[0.98] shadow-inner': selectedArtistIds.has(artist.id || ''),
                            'bg-white/5 border-transparent hover:bg-white/10': !selectedArtistIds.has(artist.id || '')
                        }">

                    <div class="relative">
                        <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-full overflow-hidden shrink-0 border-2 transition-transform duration-500 group-hover:scale-105"
                            [ngClass]="selectedArtistIds.has(artist.id || '') ? 'border-emerald-400' : 'border-zinc-800'">
                            <img [src]="artist.image || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'"
                                class="w-full h-full object-cover">
                        </div>

                        <!-- Selection Indicator (Pill style on image) -->
                        <div *ngIf="selectedArtistIds.has(artist.id || '')"
                            class="absolute -top-1 -right-1 w-5 h-5 bg-emerald-500 rounded-full flex items-center justify-center text-black border-2 border-zinc-900 animate-scale-in">
                            <app-svg-icon name="check" width="10" height="10" class="font-bold"></app-svg-icon>
                        </div>
                    </div>

                    <div class="min-w-0 w-full">
                        <p class="text-[10px] sm:text-sm font-bold truncate transition-colors"
                            [ngClass]="selectedArtistIds.has(artist.id || '') ? 'text-emerald-400' : 'text-zinc-300'">
                            {{artist.name}}
                        </p>
                    </div>
                </div>
                }
            </div>
        </div>

        <!-- Footer Action - Ultra Compact -->
        <div
            class="p-3 sm:p-8 shrink-0 bg-gradient-to-t from-black to-zinc-900/90 border-t border-white/5 flex justify-center">
            <button (click)="startShuffle()" [disabled]="selectedArtistIds.size === 0 || isShuffling"
                class="w-auto px-10 h-10 sm:h-16 rounded-full sm:rounded-2xl bg-gradient-to-r from-emerald-500 to-green-600 text-black font-black text-[10px] sm:text-lg uppercase tracking-[0.1em] sm:tracking-[0.2em] shadow-lg shadow-emerald-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-50 disabled:scale-100 flex items-center justify-center gap-2">

                @if (isShuffling) {
                <div class="w-3 h-3 border-2 border-black/30 border-t-black rounded-full animate-spin"></div>
                <span>Mezclando...</span>
                } @else {
                <app-svg-icon name="shuffle" width="14" height="14" class="sm:w-6 sm:h-6"></app-svg-icon>
                <span>Comenzar</span>
                }
            </button>
        </div>
    </div>
</div>
