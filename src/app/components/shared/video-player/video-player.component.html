@if (currentVideoUrl()) {
<div (click)="minimizeVideo()" class="fixed inset-0 z-[5000] w-screen h-screen p-4 transition-all duration-300"
    [ngClass]="isMinimized() ? 'bg-transparent pointer-events-none block' : 'bg-black flex flex-col items-center justify-center pointer-events-auto'">

    <!-- Main Content Wrapper -->
    <div (click)="handlePlayerClick($event)" (mousedown)="onDragStart($event)" (touchstart)="onDragStart($event)"
        [ngStyle]="getVideoStyle()"
        class="transition-all duration-500 ease-in-out relative shadow-2xl pointer-events-auto" [ngClass]="isMinimized() ? 
                'fixed -bottom-14 right-2 md:-bottom-16 md:right-2 z-[5001] w-[200px] md:w-[320px] cursor-move rounded-lg overflow-hidden ring-2 ring-emerald-500/50 bg-black' : 
                'w-full max-w-5xl flex items-center justify-center gap-4 md:gap-12 animate-scale-in'">

        <!-- Previous Button (PC) - Hidden when minimized -->
        <button *ngIf="!isMinimized()" (click)="prevVideo(); $event.stopPropagation()"
            [disabled]="currentVideoIndex() <= 0"
            class="hidden md:flex w-12 h-12 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-white items-center justify-center disabled:opacity-20 disabled:cursor-not-allowed transition-all hover:scale-110 active:scale-95 group border border-white/10 shadow-xl shrink-0">
            <app-svg-icon name="chevron-left"
                class="w-8 h-8 group-hover:-translate-x-0.5 transition-transform"></app-svg-icon>
        </button>

        <!-- Video Container Wrapper -->
        <!-- When minimized, width matches parent (280px/400px). When maximized, follows original logic -->
        <div [ngClass]="isMinimized() ? 'w-full' : 'relative w-[90vw] md:w-[50vw]'">

            <!-- Controls Container (Minimize & Close) -->
            @if (!isMinimized()) {
            <div class="absolute -top-10 right-0 flex gap-3 z-[105]">
                <!-- Minimize Button -->
                <button (click)="minimizeVideo(); $event.stopPropagation()"
                    class="bg-gray-500/20 hover:bg-green-600/90 text-white w-8 h-8 md:w-9 md:h-9 flex items-center justify-center rounded-full shadow-lg transition-all hover:scale-110 active:scale-95 border border-white/20 backdrop-blur-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                        </path>
                    </svg>
                </button>

                <!-- Close Button -->
                <button (click)="closeVideo(); $event.stopPropagation()"
                    class="bg-gray-500/20 hover:bg-red-600/90 text-white w-8 h-8 md:w-9 md:h-9 flex items-center justify-center rounded-full shadow-lg transition-all hover:scale-110 active:scale-95 border border-white/20 backdrop-blur-md">
                    <app-svg-icon name="x" class="w-4 h-4"></app-svg-icon>
                </button>
            </div>
            }

            <!-- Video Frame -->
            <div
                [ngClass]="isMinimized() ? 'h-auto aspect-video rounded-none' : 'relative w-full h-[40vh] md:h-[60vh] aspect-video bg-black rounded-xl overflow-hidden border border-white/10 ring-1 ring-white/5'">
                <!-- Overlay to trap clicks when minimized -->
                @if (isMinimized()) {
                <div class="absolute inset-0 z-50 bg-transparent"></div>
                }

                <iframe [src]="currentVideoUrl()! | safe" class="w-full h-full" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>

            <!-- Mobile Controls (Below Video) - Hidden when minimized -->
            @if (!isMinimized()) {
            <div class="flex md:hidden items-center justify-center gap-12 mt-6">
                <button (click)="prevVideo(); $event.stopPropagation()" [disabled]="currentVideoIndex() <= 0"
                    class="w-12 h-12 rounded-full bg-zinc-800 text-white flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed active:scale-95 transition-transform shadow-lg border border-white/10">
                    <app-svg-icon name="chevron-left" class="w-8 h-8"></app-svg-icon>
                </button>

                <button (click)="nextVideo(); $event.stopPropagation()"
                    [disabled]="currentVideoIndex() >= videos().length - 1"
                    class="w-12 h-12 rounded-full bg-zinc-800 text-white flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed active:scale-95 transition-transform shadow-lg border border-white/10">
                    <app-svg-icon name="chevron-right" class="w-8 h-8"></app-svg-icon>
                </button>
            </div>
            }
        </div>

        <!-- Next Button (PC) - Hidden when minimized -->
        <button *ngIf="!isMinimized()" (click)="nextVideo(); $event.stopPropagation()"
            [disabled]="currentVideoIndex() >= videos().length - 1"
            class="hidden md:flex w-12 h-12 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-white items-center justify-center disabled:opacity-20 disabled:cursor-not-allowed transition-all hover:scale-110 active:scale-95 group border border-white/10 shadow-xl shrink-0">
            <app-svg-icon name="chevron-right"
                class="w-8 h-8 group-hover:translate-x-0.5 transition-transform"></app-svg-icon>
        </button>
    </div>

    <!-- YouTube Link (Bottom Centered) - Hidden when minimized & ONLY if fallback needed -->
    <div *ngIf="!isMinimized() && showYoutubeFallback()"
        class="mt-8 opacity-80 hover:opacity-100 transition-opacity z-[10002] select-none cursor-pointer">
        <a [href]="watchOnYoutubeUrl()" target="_blank" (click)="$event.stopPropagation()"
            class="flex items-center gap-2 px-4 py-2 bg-red-600/20 hover:bg-red-600 text-white text-xs font-medium rounded-full transition-colors border border-red-500/30">
            <app-svg-icon name="youtube" class="text-white" width="14" height="14"></app-svg-icon>
            <span>Video no disponible? Ver en YouTube</span>
        </a>
    </div>
</div>
}
