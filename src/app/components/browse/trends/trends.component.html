<div class="space-y-4 md:space-y-8 animate-fade-in" appInfiniteScroll (scrolled)="loadMore()">
    <!-- SEO-optimized header with semantic HTML -->
    <header class="mb-4 md:mb-8 px-1 text-center">
        <h1
            class="text-2xl md:text-3xl lg:text-4xl font-black bg-gradient-to-r from-emerald-400 to-cyan-500 bg-clip-text text-transparent">
            Tendencias Globales
        </h1>
        <p class="text-zinc-400 text-xs md:text-base mt-1">
            Lo más escuchado del momento. 🎵
        </p>
    </header>

    <!-- Region Filters - Compact Pills -->
    <div class="flex gap-2 mb-4 md:mb-6 overflow-x-auto pb-2 no-scrollbar px-1">
        <button *ngFor="let region of regions" (click)="changeRegion(region.code)"
            class="flex items-center gap-2 px-4 py-2 rounded-full font-bold text-xs md:text-sm transition-all duration-300 border backdrop-blur-md active:scale-95 whitespace-nowrap"
            [ngClass]="{
                'bg-emerald-500 border-emerald-500 text-black shadow-lg shadow-emerald-500/20': selectedRegion() === region.code,
                'bg-zinc-900 border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-white': selectedRegion() !== region.code
            }">
            <span class="text-lg">{{region.flag}}</span>
            <span>{{region.name}}</span>
        </button>
    </div>

    <!-- Loading state -->
    <div *ngIf="loading()" class="space-y-3 animate-fade-in">
        <app-skeleton *ngFor="let i of [1,2,3,4,5,6,7,8]" type="list-item"></app-skeleton>
    </div>

    <!-- Content State -->
    <div *ngIf="!loading()">

        <!-- EMPTY STATE (No songs) -->
        <div *ngIf="trendingSongs().length === 0"
            class="flex flex-col items-center justify-center py-20 text-center animate-fade-in px-4">
            <div
                class="w-20 h-20 bg-zinc-900 rounded-full flex items-center justify-center mb-4 text-zinc-700 border border-zinc-800">
                <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M6 21H3a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1zm7 0h-3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v17a1 1 0 0 1-1 1zm7 0h-3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1z" />
                </svg>
            </div>
            <h3 class="text-white font-bold text-lg mb-2">No hay tendencias disponibles</h3>
            <p class="text-zinc-500 text-sm max-w-xs mx-auto">
                No pudimos cargar los datos para esta región. Intenta con otra.
            </p>
        </div>

        <!-- LIST OF SONGS -->
        <div *ngIf="trendingSongs().length > 0" class="flex flex-col gap-3 min-h-[50vh]">

            <!-- Items Loop -->
            <ng-container *ngFor="let song of trendingSongs(); let i = index">
                <article (click)="onSongClick(song, $event)" [ngClass]="{
                        'bg-yellow-500/30 border-yellow-500/50 hover:bg-yellow-500/40': i === 0,
                        'bg-zinc-400/25 border-zinc-400/40 hover:bg-zinc-400/35': i === 1,
                        'bg-amber-700/30 border-amber-600/50 hover:bg-amber-700/40': i === 2,
                        'bg-zinc-900/40 border-white/5 hover:border-white/20': i > 2
                    }" class="group flex items-center gap-3 p-3 rounded-xl border transition-all">

                    <!-- Rank -->
                    <div class="flex items-center justify-center w-8 md:w-10 flex-shrink-0">
                        <span class="text-xl md:text-2xl font-bold" [class.text-yellow-400]="i === 0"
                            [class.text-zinc-300]="i === 1" [class.text-orange-500]="i === 2"
                            [class.text-zinc-600]="i > 2">
                            {{i + 1}}
                        </span>
                    </div>

                    <!-- Image -->
                    <div
                        class="relative w-12 h-12 md:w-14 md:h-14 rounded-lg overflow-hidden flex-shrink-0 bg-zinc-800 shadow-lg">
                        <img [ngSrc]="song.img" [alt]="song.title" (error)="onImageError($event)" width="64" height="64"
                            class="w-full h-full object-cover">
                    </div>

                    <!-- Info -->
                    <div class="flex-1 min-w-0">
                        <h3 class="text-white font-bold text-sm md:text-base truncate transition-colors">
                            {{song.title}}
                        </h3>
                        <p class="text-zinc-400 text-xs truncate">
                            {{song.artist}}
                        </p>
                    </div>

                    <!-- Duration / Icon -->
                    <div class="text-zinc-400 text-xs font-mono">
                        {{song.duration || '0:00'}}
                    </div>
                </article>

                <!-- ADSTERRA ADS (After 5th item / Top 5) -->

            </ng-container>

            <!-- End Message -->
            <div *ngIf="!hasMore" class="text-center opacity-50">
                <div class="h-px w-24 bg-gradient-to-r from-transparent via-zinc-700 to-transparent mx-auto mb-4"></div>
                <p class="text-zinc-500 text-xs">Fin de la lista</p>
            </div>
        </div>
    </div>

    <!-- ADSTERRA ADS BOOSTER (End of List) -->
    <app-ads-container [index]="1"></app-ads-container>

    <!-- Loading More -->
    <div *ngIf="loadingMore()" class="flex justify-center py-4">
        <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
</div>
