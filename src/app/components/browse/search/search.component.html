<div class="space-y-4 md:space-y-6 animate-fade-in relative">

    <!-- Search Header -->
    <div
        class="flex flex-col md:flex-row gap-6 md:gap-4 items-center justify-between mb-6 md:mb-8 text-center md:text-left">
        <div class="w-full md:w-auto">
            <h2
                class="text-3xl md:text-4xl font-black bg-gradient-to-r from-pink-400 to-rose-500 bg-clip-text text-transparent mb-2">
                Buscador Global
            </h2>
            <p class="text-zinc-400 text-sm md:text-base">
                Encuentra canciones, artistas y sus letras.
            </p>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full md:w-96 group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="text-zinc-400 text-lg md:text-xl group-focus-within:text-pink-500 transition-colors w-5 h-5 md:w-6 md:h-6"
                    fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.396 1.414-1.414-4.396-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z" />
                </svg>
            </div>
            <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()"
                class="block w-full pl-9 md:pl-10 pr-3 py-3 md:py-3 border border-zinc-700 rounded-full leading-5 bg-zinc-900 text-zinc-300 placeholder-zinc-500 focus:outline-none focus:bg-black focus:border-pink-500 focus:ring-1 focus:ring-pink-500 text-base transition-all shadow-lg"
                placeholder="¿Qué quieres leer?">
            <button *ngIf="searchQuery()" (click)="onSearch()"
                class="absolute inset-y-1 right-1 px-4 bg-pink-600 hover:bg-pink-500 text-white rounded-full text-sm font-bold transition-colors">
                Buscar
            </button>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isSearching()" class="space-y-3">
        @for (i of [1,2,3,4,5,6]; track i) {
        <app-skeleton type="list-item"></app-skeleton>
        }
    </div>

    <!-- Results Grid -->
    <div *ngIf="!isSearching()" class="grid gap-2 w-full">
        <div *ngFor="let song of searchResults()" (click)="viewLyrics(song)"
            class="flex items-center gap-2 md:gap-4 p-2 md:p-3 rounded-lg bg-zinc-900/40 border border-zinc-800 hover:bg-zinc-800 hover:border-zinc-700 transition-all group w-full overflow-hidden cursor-pointer">
            <!-- Cover With Play Overlay -->
            <div
                class="w-10 h-10 md:w-14 md:h-14 bg-zinc-800 rounded-md overflow-hidden shadow-sm relative group/cover group-hover:shadow-pink-500/20 transition-all flex-shrink-0">
                <img [src]="song.img" alt="Cover" loading="lazy" class="w-full h-full object-cover">
                <div (click)="playSong(song); $event.stopPropagation()"
                    class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover/cover:opacity-100 transition-opacity">
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </div>
            </div>

            <!-- Info -->
            <div class="flex-1 min-w-0 pr-1">
                <h3
                    class="font-bold text-sm md:text-base text-white truncate group-hover:text-pink-400 transition-colors leading-tight">
                    {{song.title}}</h3>
                <p class="text-zinc-500 text-[11px] md:text-sm truncate leading-tight">{{song.artist}}</p>
            </div>

            <!-- Actions -->
            <div class="flex items-center flex-shrink-0 gap-2">
                <!-- 0. Play Button (Explicit) -->
                <button (click)="playSong(song); $event.stopPropagation()"
                    class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-pink-500/10 hover:bg-pink-500 text-pink-500 hover:text-white transition-all flex items-center justify-center group/play"
                    title="Reproducir">
                    <svg class="w-4 h-4 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </button>
                <!-- 1. View Button (Eye) -->
                <button (click)="viewLyrics(song); $event.stopPropagation()"
                    class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white transition-colors flex items-center justify-center relative"
                    title="Ver Letra">
                    <svg class="w-4 h-4 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                    </svg>
                </button>

                <!-- 2. Download Lyric Button (Saves Text) -->
                <button (click)="toggleSaveLyrics(song, $event)"
                    class="w-8 h-8 md:w-10 md:h-10 rounded-full hover:bg-zinc-700 transition-colors flex items-center justify-center relative"
                    [class.bg-pink-600]="isSongLyricsSaved(song)" [class.text-white]="isSongLyricsSaved(song)"
                    [class.bg-zinc-800]="!isSongLyricsSaved(song)" [class.text-zinc-400]="!isSongLyricsSaved(song)"
                    [class.hover:text-white]="!isSongLyricsSaved(song)"
                    [title]="isSongLyricsSaved(song) ? 'Letra Guardada' : 'Descargar Letra (Texto)'">

                    <!-- Not Saved: Download Icon -->
                    <svg *ngIf="!isSongLyricsSaved(song)" class="w-4 h-4 md:w-5 md:h-5 " fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>

                    <!-- Saved: Check/Document Icon -->
                    <svg *ngIf="isSongLyricsSaved(song)" class="w-4 h-4 md:w-5 md:h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                </button>

                <!-- 3. Share Button -->
                <button (click)="shareSong(song, $event)"
                    class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-zinc-800 hover:bg-zinc-700 flex items-center justify-center transition-colors text-zinc-400 hover:text-green-400"
                    title="Compartir">
                    <svg class="w-4 h-4 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M5.5 15a3.51 3.51 0 0 0 2.36-.93l6.26 3.58a3.06 3.06 0 0 0-.12.85 3.53 3.53 0 1 0 1.14-2.57l-6.26-3.58a2.74 2.74 0 0 0 .12-.76l6.15-3.52A3.49 3.49 0 1 0 14 5.5a3.35 3.35 0 0 0 .12.85L8.43 9.6A3.5 3.5 0 1 0 5.5 15z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="mt-8 w-full">
        <app-ads-container [index]="0"></app-ads-container>
    </div>

    <!-- Lyrics Modal (Same as before) -->
    <div *ngIf="showLyrics()"
        class="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
        <div
            class="bg-zinc-900 border-t md:border border-zinc-700 rounded-t-2xl md:rounded-2xl w-full md:max-w-2xl h-[85vh] md:max-h-[80vh] flex flex-col shadow-2xl shadow-pink-900/20 relative overflow-hidden">

            <!-- Modal Header -->
            <div
                class="bg-gradient-to-r from-pink-600 to-rose-600 p-4 md:p-6 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                    <svg class="w-6 h-6 md:w-8 md:h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M16 3v5h4l-7 7-7-7h4V3z" />
                        <path
                            d="M9 14c-2.206 0-4 1.794-4 4s1.794 4 4 4 4-1.794 4-4-1.794-4-4-4zm6.5 4c0-1.103.897-2 2-2s2 .897 2 2-.897 2-2 2-2-.897-2-2z" />
                    </svg>
                    <div class="min-w-0 flex-1">
                        <h3 class="text-base md:text-xl font-bold text-white truncate">Letra</h3>
                        <p class="text-xs md:text-sm text-pink-100 truncate">{{selectedSongTitle()}} -
                            {{selectedSongArtist()}}</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button (click)="saveLyrics()"
                        class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-black/20 hover:bg-black/40 flex items-center justify-center text-white transition-colors flex-shrink-0"
                        [title]="isLyricsSaved() ? 'Guardado' : 'Guardar letra'">
                        <svg class="w-5 h-5 md:w-6 md:h-6" fill="currentColor" viewBox="0 0 24 24"
                            *ngIf="!isLyricsSaved()">
                            <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z" />
                        </svg>
                        <svg class="w-5 h-5 md:w-6 md:h-6" fill="currentColor" viewBox="0 0 24 24"
                            *ngIf="isLyricsSaved()">
                            <path
                                d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm-2 13l-3-1.8L9 16V5h6v11z" />
                        </svg>
                    </button>
                    <button (click)="shareLyrics()"
                        class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-black/20 hover:bg-black/40 flex items-center justify-center text-white transition-colors flex-shrink-0"
                        title="Compartir letra">
                        <svg class="w-5 h-5 md:w-6 md:h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M5.5 15a3.51 3.51 0 0 0 2.36-.93l6.26 3.58a3.06 3.06 0 0 0-.12.85 3.53 3.53 0 1 0 1.14-2.57l-6.26-3.58a2.74 2.74 0 0 0 .12-.76l6.15-3.52A3.49 3.49 0 1 0 14 5.5a3.35 3.35 0 0 0 .12.85L8.43 9.6A3.5 3.5 0 1 0 5.5 15z" />
                        </svg>
                    </button>
                    <button (click)="closeLyrics()"
                        class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-black/20 hover:bg-black/40 flex items-center justify-center text-white transition-colors flex-shrink-0">
                        <svg class="w-6 h-6 md:w-8 md:h-8" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M18.3 5.71a.996.996 0 0 0-1.41 0L12 10.59 7.11 5.7A.996.996 0 1 0 5.7 7.11L10.59 12 5.7 16.89a.996.996 0 1 0 1.41 1.41L12 13.41l4.89 4.88a.996.996 0 1 0 1.41-1.41L12 13.41l4.89-4.89c.38-.38.38-1.02 0-1.4z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Modal Content -->
            <div class="flex-1 overflow-y-auto p-4 md:p-6">
                <!-- Loading Skeleton -->
                <div *ngIf="loadingLyrics()" class="space-y-6 py-4">
                    <app-skeleton type="text" width="100%"></app-skeleton>
                    <app-skeleton type="text" width="95%"></app-skeleton>
                    <app-skeleton type="text" width="90%"></app-skeleton>
                    <app-skeleton type="text" width="100%"></app-skeleton>
                    <app-skeleton type="text" width="85%"></app-skeleton>
                    <div class="h-4"></div>
                    <app-skeleton type="text" width="98%"></app-skeleton>
                    <app-skeleton type="text" width="92%"></app-skeleton>
                </div>

                <!-- Content (Success) -->
                <pre *ngIf="!loadingLyrics() && selectedSongLyrics()"
                    class="text-zinc-200 text-sm md:text-base leading-relaxed md:leading-loose whitespace-pre-wrap font-sans mb-8">{{selectedSongLyrics()}}</pre>

                <!-- Content (Not Found) -->
                <div *ngIf="!loadingLyrics() && !selectedSongLyrics()"
                    class="flex flex-col items-center justify-center py-2 text-center">
                    <div class="w-12 h-12 bg-zinc-800 rounded-full flex items-center justify-center mb-3">
                        <svg class="w-6 h-6 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                            </path>
                        </svg>
                    </div>
                    <h3 class="text-white font-bold text-sm mb-1">No hay letra disponible</h3>
                </div>

                <!-- Ad at the end of lyrics -->
                <div class="mt-2 mb-12 md:mb-4">
                    <app-ads-container [index]="1" [forceIframe]="true"></app-ads-container>
                </div>
            </div>
        </div>
    </div>
</div>
