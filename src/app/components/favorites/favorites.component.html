<section class="mb-12">
    <!-- Play All Hero Section -->
    <div class="relative overflow-hidden bg-gradient-to-br from-red-600 via-red-700 to-pink-800 rounded-2xl md:rounded-3xl p-5 md:p-10 shadow-2xl shadow-red-500/40 border border-red-500/20 cursor-pointer hover:scale-[1.02] transition-transform"
        (click)="onPlayAll()">

        <!-- Animated Background Pattern -->
        <div
            class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iMC4wNSI+PHBhdGggZD0iTTM2IDE0YzAtMi4yMSAxLjc5LTQgNC00czQgMS43OSA0IDQtMS43OSA0LTQgNC00LTEuNzktNC00em0wIDQwYzAtMi4yMSAxLjc5LTQgNC00czQgMS43OSA0IDQtMS43OSA0LTQgNC00LTEuNzktNC00ek0xNCAzNmMtMi4yMSAwLTQtMS43OS00LTRzMS43OS00IDQtNCA0IDEuNzkgNCA0LTEuNzkgNC00IDR6Ii8+PC9nPjwvZz48L3N2Zz4=')] opacity-30">
        </div>

        <!-- Glow Effects -->
        <div
            class="absolute top-0 right-0 w-64 h-64 md:w-96 md:h-96 bg-pink-500/20 rounded-full blur-3xl -mr-20 -mt-20">
        </div>
        <div
            class="absolute bottom-0 left-0 w-64 h-64 md:w-96 md:h-96 bg-red-500/20 rounded-full blur-3xl -ml-20 -mb-20">
        </div>

        <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-5 md:gap-8">
            <div class="flex items-center gap-4 md:gap-6 w-full md:w-auto">
                <!-- Animated Heart Icon -->
                <div class="relative shrink-0">
                    <div
                        class="w-14 h-14 md:w-20 md:h-20 bg-white/10 backdrop-blur-sm rounded-xl md:rounded-2xl flex items-center justify-center border border-white/20 shadow-xl">
                        <svg class="w-7 h-7 md:w-10 md:h-10 text-white drop-shadow-lg animate-pulse" fill="currentColor"
                            viewBox="0 0 24 24">
                            <path
                                d="M20.205 4.791a5.938 5.938 0 0 0-4.209-1.754A5.906 5.906 0 0 0 12 4.595a5.904 5.904 0 0 0-3.996-1.558 5.942 5.942 0 0 0-4.213 1.758c-2.353 2.363-2.352 6.059.002 8.412L12 21.414l8.207-8.207c2.354-2.353 2.355-6.049-.002-8.416z" />
                        </svg>
                    </div>
                    <div
                        class="absolute -top-1 -right-1 w-5 h-5 md:w-6 md:h-6 bg-pink-400 rounded-full flex items-center justify-center text-[10px] md:text-xs font-bold text-white shadow-lg">
                        {{favorites.length}}
                    </div>
                </div>

                <!-- Text Info -->
                <div class="text-white flex-1 min-w-0">
                    <h3 class="text-2xl md:text-4xl font-bold mb-1 md:mb-2 drop-shadow-lg truncate">Mis Favoritos</h3>
                    <p class="text-red-100/80 text-sm md:text-lg truncate">{{favorites.length}} canciones que amas</p>
                </div>
            </div>

            <!-- Play All Button -->
            <button
                class="group relative w-full md:w-auto px-6 py-3 md:px-10 md:py-5 bg-white hover:bg-red-50 text-red-600 font-bold rounded-xl md:rounded-2xl transition-all shadow-xl hover:shadow-white/30 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-3">
                <div
                    class="absolute inset-0 bg-gradient-to-r from-white to-pink-50 rounded-xl md:rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity">
                </div>
                <svg class="w-6 h-6 md:w-8 md:h-8 relative z-10 group-hover:scale-110 transition-transform"
                    fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z" />
                    <path d="m9 16 7-4-7-4z" />
                </svg>
                <div class="relative z-10 text-left">
                    <div class="text-xs md:text-sm opacity-75 font-normal leading-none mb-0.5">Reproducir</div>
                    <div class="text-base md:text-xl leading-none">Todas las Favoritas</div>
                </div>
            </button>
        </div>
    </div>

    <!-- Empty State Improved -->
    <div *ngIf="favorites.length === 0"
        class="text-center py-16 bg-gradient-to-br from-red-900/10 to-pink-900/10 rounded-2xl border border-red-800/30 border-dashed px-6">
        <div
            class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border-2 border-red-500/20">
            <svg class="w-10 h-10 text-red-500/50" fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M20.205 4.791a5.938 5.938 0 0 0-4.209-1.754A5.906 5.906 0 0 0 12 4.595a5.904 5.904 0 0 0-3.996-1.558 5.942 5.942 0 0 0-4.213 1.758c-2.353 2.363-2.352 6.059.002 8.412L12 21.414l8.207-8.207c2.354-2.353 2.355-6.049-.002-8.416z" />
            </svg>
        </div>
        <h3 class="text-xl md:text-3xl font-black text-white mb-3">Tu colección está vacía</h3>
        <p class="text-base text-zinc-400 max-w-md mx-auto leading-relaxed mb-8">
            Aún no has guardado canciones. Explora las tendencias mundiales y crea tu propia biblioteca musical.
        </p>

        <!-- CTA Button -->
        <a routerLink="/browse/trends"
            class="inline-flex items-center gap-2 px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition-all hover:scale-105 shadow-xl shadow-red-900/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            Explorar Música Nueva
        </a>
    </div>

    <!-- Favorites List -->
    <div *ngIf="favorites.length > 0" class="space-y-2">
        <div *ngFor="let song of favorites; let i = index" (click)="onPlaySong(song)"
            class="group flex items-center gap-3 md:gap-4 p-2 md:p-3 rounded-xl hover:bg-zinc-900/50 transition-colors border border-transparent hover:border-zinc-800 cursor-pointer"
            [class.bg-zinc-900]="currentSongId === song.id" [class.border-l-4]="currentSongId === song.id"
            [class.border-l-red-500]="currentSongId === song.id">

            <!-- Number/Play Icon -->
            <div class="w-6 md:w-8 flex items-center justify-center flex-shrink-0 text-zinc-500 text-sm font-bold">
                <span class="group-hover:hidden" [class.text-red-500]="currentSongId === song.id">{{ i + 1 }}</span>
                <button class="hidden group-hover:block text-white hover:scale-110 transition-transform">
                    <svg class="w-5 h-5 md:w-6 md:h-6" fill="currentColor" viewBox="0 0 24 24"
                        *ngIf="currentSongId !== song.id || !isPlaying">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    <svg class="w-5 h-5 md:w-6 md:h-6 text-red-500" fill="currentColor" viewBox="0 0 24 24"
                        *ngIf="currentSongId === song.id && isPlaying">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                    </svg>
                </button>
            </div>

            <!-- Album Art -->
            <div
                class="relative w-10 h-10 md:w-12 md:h-12 rounded-lg overflow-hidden bg-zinc-800 shadow-sm flex-shrink-0">
                <img [src]="song.img" class="w-full h-full object-cover">
            </div>

            <!-- Song Info -->
            <div class="flex-1 min-w-0">
                <h4 class="text-white font-bold text-sm md:text-base truncate leading-tight mb-0.5"
                    [class.text-red-500]="currentSongId === song.id">{{ song.title }}</h4>
                <p class="text-zinc-500 text-xs md:text-sm truncate">{{ song.artist }}</p>
            </div>

            <!-- Like Button (Remove) -->
            <button (click)="onRemove(song.id, $event)" title="Quitar de favoritos"
                class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center hover:bg-zinc-800 transition-colors active:scale-95 group/btn">
                <svg class="w-5 h-5 md:w-6 md:h-6 text-red-500 group-hover/btn:text-red-400 group-hover/btn:scale-110 transition-transform animate-heart-burst"
                    fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
            </button>
        </div>
    </div>
</section>
